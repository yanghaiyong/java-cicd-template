# ============================================
# 聚合项目 (Maven Multi-Module) Maven 构建模板
# ============================================
# 适用场景: 聚合项目,包含多个可部署应用/微服务
# 设计原则: 复用 common_java/package.yaml 的所有设计
#
# 与 common_java/package.yaml 的区别:
#   - 支持 parallel:matrix 构建多个 app
#   - 每个 app 单独构建,带 -am 依赖

.aggregate_mvn_package:
  stage: package
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  before_script:
    - |
      echo "========================================="
      echo "聚合项目 Maven 构建 - $APP_NAME"
      echo "Maven 模块路径: $APP_MAVEN_PATH"
      echo "时间: $(date +'%Y-%m-%d %H:%M:%S')"
      echo "========================================="
      java -version 2>&1 | head -1
      mvn --version 2>&1 | head -1
      mkdir -p .m2/repository
      echo "工作目录: $(pwd)"
  script:
    - |
      echo "构建模块: $APP_MAVEN_PATH"
      mvn clean package -B -DskipTests \
        -Dmaven.repo.local=.m2/repository \
        -Dmaven.javadoc.skip=true \
        -pl "$APP_MAVEN_PATH" -am \
        -f pom.xml -s settings.xml
  after_script:
    - |
      echo "构建产物:"
      ls -lh $APP_MAVEN_PATH/target/*.jar 2>/dev/null || echo "未找到 JAR"
  artifacts:
    name: "$APP_NAME-$CI_COMMIT_REF_NAME"
    when: on_success
    expire_in: 30 days
    paths:
      - $APP_MAVEN_PATH/target/*.jar
  cache:
    policy: pull-push
    key: "maven-aggregate-$CI_COMMIT_REF_SLUG"
    paths:
      - .m2/repository
      - $APP_MAVEN_PATH/target/

# 全项目编译验证 (所有 app 依赖)
.aggregate_maven_compile:
  stage: package
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  before_script:
    - mkdir -p .m2/repository
  script:
    - |
      echo "全项目编译验证"
      mvn -B -ntp -T 1C compile \
        -DskipTests \
        -Dcheckstyle.skip=true \
        -Dmaven.javadoc.skip=true \
        -Dmaven.repo.local=.m2/repository \
        -f pom.xml -s settings.xml
  cache:
    policy: pull-push
    key: "maven-aggregate-$CI_COMMIT_REF_SLUG"
    paths:
      - .m2/repository
