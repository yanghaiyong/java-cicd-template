# ============================================
# 聚合项目 (Maven Multi-Module) 测试模板
# ============================================
# 适用场景: 聚合项目,包含多个可部署应用/微服务
# 设计原则: 复用 common_java/test.yaml 的所有设计
#
# 与 common_java/test.yaml 的区别:
#   - 支持 parallel:matrix 测试多个 app
#   - 每个 app 单独测试

# 单 app 测试模板 (matrix 中每个 job 单独调用)
.aggregate_test:
  stage: test
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  before_script:
    - |
      echo "========================================="
      echo "聚合项目测试 - $APP_NAME"
      echo "========================================="
      mkdir -p .m2/repository
  script:
    - |
      $TEST_SHELL -pl "$APP_MAVEN_PATH" -am
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: ${APP_MAVEN_PATH}/${JUNIT_REPORT_PATH}TEST-*.xml
      coverage_report:
        coverage_format: jacoco
        path: ${APP_MAVEN_PATH}/${JACOCO_REPORT_PATH}
    paths:
      - ${APP_MAVEN_PATH}/${JUNIT_REPORT_PATH}
      - ${APP_MAVEN_PATH}/${JACOCO_REPORT_DIR}
  cache:
    policy: pull-push
    key: "maven-aggregate-${CI_COMMIT_REF_SLUG}"
    paths:
      - .m2/repository

# 全部 app 线性测试模板 (资源不足时使用,顺序执行,避免并行 job 超出集群 quota)
.aggregate_test_all:
  stage: test
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  before_script:
    - |
      echo "========================================="
      echo "聚合项目测试(线性) - App 列表: $DEPLOYABLE_APPS"
      echo "时间: $(date +'%Y-%m-%d %H:%M:%S')"
      echo "========================================="
      java -version 2>&1 | head -1
      mvn --version 2>&1 | head -1
      mkdir -p .m2/repository
  script:
    - |
      echo "逐个测试所有可部署应用..."
      failed_apps=""
      for app_path in $DEPLOYABLE_APPS; do
        app_name=$(basename "$app_path")
        echo ""
        echo "========================================="
        echo "测试: $app_name ($app_path)"
        echo "========================================="
        if $TEST_SHELL -pl "$app_path" -am; then
          echo "✓ 测试通过: $app_name"
        else
          echo "✗ 测试失败: $app_name"
          failed_apps="$failed_apps $app_name"
        fi
      done
      echo ""
      echo "========================================="
      echo "测试汇总"
      echo "========================================="
      if [ -n "$failed_apps" ]; then
        echo "失败的应用:$failed_apps"
        exit 1
      else
        echo "全部测试通过!"
      fi
  cache:
    policy: pull-push
    key: "maven-aggregate-$CI_COMMIT_REF_SLUG"
    paths:
      - .m2/repository
