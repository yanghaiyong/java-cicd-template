# ============================================
# 聚合项目 (Maven Multi-Module) 测试模板
# ============================================
# 适用场景: 聚合项目,包含多个可部署应用/微服务
# 设计原则: 复用 common_java/test.yaml 的所有设计
#
# 与 common_java/test.yaml 的区别:
#   - 支持 parallel:matrix 测试多个 app
#   - 每个 app 单独测试

.aggregate_test:
  stage: test
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  before_script:
    - |
      echo "========================================="
      echo "聚合项目测试 - $APP_NAME"
      echo "========================================="
      mkdir -p .m2/repository
  script:
    - |
      mvn test jacoco:report -B \
        -Dmaven.repo.local=.m2/repository \
        -pl "$APP_MAVEN_PATH" -am \
        -f pom.xml -s settings.xml
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: $APP_MAVEN_PATH/target/surefire-reports/TEST-*.xml
      coverage_report:
        coverage_format: jacoco
        path: $APP_MAVEN_PATH/target/site/jacoco/jacoco.xml
    paths:
      - $APP_MAVEN_PATH/target/surefire-reports/
      - $APP_MAVEN_PATH/target/site/jacoco/
  cache:
    policy: pull-push
    key: "maven-aggregate-$CI_COMMIT_REF_SLUG"
    paths:
      - .m2/repository
