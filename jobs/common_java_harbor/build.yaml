.docker_build_harbor:
  stage: build
  image: docker.m.daocloud.io/moby/buildkit:latest
  variables:
    DOCKER_CONFIG: /tmp/docker-config
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  before_script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG=$CI_COMMIT_TAG
      else
        IMAGE_TAG="${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
      fi
      export IMAGE_TAG
      export CI_REGISTRY_FULL_IMAGE="$CI_REGISTRY/$CI_REGISTRY_IMAGE:$IMAGE_TAG"
      export SSL_CERT_FILE=/etc/docker/certs.d/harbor-ui.test.com/ca.crt
      mkdir -p "$HOME/.config/buildkit/certs/harbor-ui.test.com"
      cp /etc/docker/certs.d/harbor-ui.test.com/ca.crt \
         "$HOME/.config/buildkit/certs/harbor-ui.test.com/ca.crt"
      mkdir -p "$DOCKER_CONFIG"
      AUTH=$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 -w0)
      printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$AUTH" > "$DOCKER_CONFIG/config.json"
      mkdir -p "$HOME/.docker"
      cp "$DOCKER_CONFIG/config.json" "$HOME/.docker/config.json"
      mkdir -p /root/.docker
      cp "$DOCKER_CONFIG/config.json" "/root/.docker/config.json"
    - |
      cat > /tmp/push-v2.py << 'PYEOF'
      import json, subprocess, sys, hashlib, tarfile, os

      oci_tar = "/tmp/image.tar"
      registry = os.environ["CI_REGISTRY"]
      repo = os.environ["CI_REGISTRY_IMAGE"]
      tag = os.environ["IMAGE_TAG"]
      user = os.environ["CI_REGISTRY_USER"]
      pw = os.environ["CI_REGISTRY_PASSWORD"]
      import base64
      creds = base64.b64encode(f"{user}:{pw}".encode()).decode()

      def wget(args, input_data=None):
          cmd = ["wget", "-q", "--no-check-certificate", "-O", "-"] + args
          r = subprocess.run(cmd, input=input_data, capture_output=True, text=True, timeout=600)
          return r.stdout, r.stderr

      token_url = f"https://{registry}/service/token?service=harbor-registry&scope=repository:{repo}:pull,push"
      out, err = wget(["--header", f"Authorization: Basic {creds}", token_url])
      token = json.loads(out).get("token", "")
      if not token:
          print(f"ERROR: no token. stderr: {err}", file=sys.stderr)
          sys.exit(1)
      print(f"Got token ({len(token)} chars)")

      hdr = f"Authorization: Bearer {token}"

      with tarfile.open(oci_tar) as t:
          idx = json.loads(t.extractfile("index.json").read())
          m_digest = idx["manifests"][0]["digest"]
          manifest = json.loads(t.extractfile(f"blobs/{m_digest}").read())
          config_digest = manifest["config"]["digest"]
          layer_digests = [l["digest"] for l in manifest.get("layers", [])]
          all_digests = [config_digest] + layer_digests

      print(f"Manifest: {manifest.get('mediaType','?')}")
      print(f"Blobs: {len(all_digests)}")

      for i, d in enumerate(all_digests, 1):
          blob_path = f"blobs/{d}"
          check_out, _ = wget(["--spider", "-H", hdr, f"https://{registry}/v2/{repo}/blobs/{d}"])
          code_out, code_err = wget(["--spider", "-H", hdr, f"https://{registry}/v2/{repo}/blobs/{d}"])
          if "200" in code_err or "200" in code_out:
              print(f"  [{i}/{len(all_digests)}] {d[:20]}... exists")
              continue
          print(f"  [{i}/{len(all_digests)}] {d[:20]}... uploading")
          with tarfile.open(oci_tar) as t:
              member = t.getmember(blob_path)
              f = t.extractfile(member)
              blob_data = f.read()
          init_out, _ = wget(["-X", "POST", "-H", hdr, "-H", "Content-Type: application/octet-stream",
                              f"https://{registry}/v2/{repo}/blobs/uploads/"])
          loc = init_out.strip()
          if not loc.startswith("http"):
              loc = f"https://{registry}/v2/{repo}/blobs/uploads/"
          put_out, put_err = wget(["-X", "PUT", "-H", hdr, "-H", "Content-Type: application/octet-stream",
                                   "--body-file", "/dev/stdin", loc], input_data=blob_data)
          print(f"    uploaded")

      print("Pushing manifest...")
      m_type = manifest.get("mediaType", "application/vnd.oci.image.manifest.v1+json")
      m_data = json.dumps(manifest).encode()
      put_out, put_err = wget(["-X", "PUT", "-H", hdr, "-H", f"Content-Type: {m_type}",
                               "--body-file", "/dev/stdin",
                               f"https://{registry}/v2/{repo}/manifests/{tag}"], input_data=m_data)
      print(f"Push complete: {os.environ['CI_REGISTRY_FULL_IMAGE']}")
      PYEOF
  script:
    - |
      echo "========================================="
      echo "Phase 1: Building image to OCI tar..."
      echo "========================================="
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context="${APP_MAVEN_PATH:-.}" \
        --local dockerfile="$(dirname "${APP_MAVEN_PATH:-.}/src/main/docker/Dockerfile")" \
        --opt filename="$(basename "${APP_MAVEN_PATH:-.}/src/main/docker/Dockerfile")" \
        --opt build-arg:BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
        --opt build-arg:VCS_REF=$CI_COMMIT_SHA \
        --opt build-arg:VERSION=$IMAGE_TAG \
        --output type=oci,name="$CI_REGISTRY_FULL_IMAGE",dest=/tmp/image.tar \
        --export-cache type=inline \
        2>&1
      echo "Build done: $(du -h /tmp/image.tar | cut -f1)"
    - |
      echo "========================================="
      echo "Phase 2: Pushing to Harbor via v2 API..."
      echo "========================================="
      python3 /tmp/push-v2.py
  needs: ["package"]
