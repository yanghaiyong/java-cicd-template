# ============================================
# Java 项目 BuildKit 镜像构建模板 (Harbor 版本)
# ============================================
# 适用场景: Java 项目,使用 Harbor 镜像仓库 + BuildKit daemonless
# 构建方式: moby/buildkit:rootless, 无需 Docker daemon
# 认证: DOCKER_AUTH_CONFIG 环境变量
# TLS: Vault Root CA + Intermediate CA 通过 ConfigMap 挂载

.docker_build_harbor:
  stage: build
  image: harbor-ui.test.com/library/buildkit:rootless
  variables:
    DOCKER_CONFIG: /tmp/docker-config
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  before_script:
    - |
      echo "========================================="
      echo "BuildKit 镜像构建 (Harbor 模式)"
      echo "时间: $(date +'%Y-%m-%d %H:%M:%S')"
      echo "========================================="
      # 计算镜像标签
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG=$CI_COMMIT_TAG
        echo "正式发布 - 使用 Tag: $IMAGE_TAG"
      else
        IMAGE_TAG="${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
        echo "非生产环境 - 使用分支标签: $IMAGE_TAG"
      fi
      export IMAGE_TAG
      CI_REGISTRY_FULL_IMAGE="$CI_REGISTRY/$CI_REGISTRY_IMAGE:$IMAGE_TAG"
      echo "镜像地址: $CI_REGISTRY_FULL_IMAGE"
      export SSL_CERT_FILE=/etc/docker/certs.d/harbor-ui.test.com/ca.crt
      export SSL_CERT_DIR=/etc/ssl/certs
      mkdir -p "$HOME/.config/buildkit/certs/harbor-ui.test.com"
      cp /etc/docker/certs.d/harbor-ui.test.com/ca.crt \
         "$HOME/.config/buildkit/certs/harbor-ui.test.com/ca.crt"
      echo "Harbor CA 证书已注入: SSL_CERT_FILE=$SSL_CERT_FILE"
      mkdir -p "$DOCKER_CONFIG"
      if [ -n "$CI_REGISTRY_USER" ] && [ -n "$CI_REGISTRY_PASSWORD" ]; then
        AUTH=$(printf '%s' "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" | base64 -w0)
        printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$AUTH" > "$DOCKER_CONFIG/config.json"
        echo "Harbor auth from CI_REGISTRY_USER/PASSWORD"
      elif [ -n "$DOCKER_AUTH_CONFIG" ]; then
        echo "$DOCKER_AUTH_CONFIG" > "$DOCKER_CONFIG/config.json"
        echo "Harbor auth from DOCKER_AUTH_CONFIG"
      else
        echo "ERROR: no auth configured"
        exit 1
      fi
      echo "config.json contents:"
      cat "$DOCKER_CONFIG/config.json" | python3 -c "import sys,json; d=json.load(sys.stdin); [print(f\"  registry={k} auth_len={len(v.get(\\\"auth\\\",\\\"\\\"))}\") for k,v in d.get(\\\"auths\\\",{}).items()]" 2>/dev/null || cat "$DOCKER_CONFIG/config.json"
      echo "BuildKit 配置完成"
  script:
    - |
      CI_REGISTRY_FULL_IMAGE="$CI_REGISTRY/$CI_REGISTRY_IMAGE:$IMAGE_TAG"
      # 确定 Dockerfile 路径
      BUILD_CONTEXT="${APP_MAVEN_PATH:-.}"
      DOCKERFILE_PATH_CALC="$BUILD_CONTEXT/src/main/docker/Dockerfile"
      [ -f "$DOCKERFILE_PATH_CALC" ] || DOCKERFILE_PATH_CALC="Dockerfile"
      DOCKERFILE_DIR=$(dirname "$DOCKERFILE_PATH_CALC")
      DOCKERFILE_NAME=$(basename "$DOCKERFILE_PATH_CALC")
      echo "Dockerfile: $DOCKERFILE_PATH_CALC"
      echo "Build Context: $BUILD_CONTEXT"
      echo "========================================="
      # BuildKit 构建并推送
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context="$BUILD_CONTEXT" \
        --local dockerfile="$DOCKERFILE_DIR" \
        --opt filename="$DOCKERFILE_NAME" \
        --opt build-arg:BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
        --opt build-arg:VCS_REF=$CI_COMMIT_SHA \
        --opt build-arg:VERSION=$IMAGE_TAG \
        --output type=image,name="$CI_REGISTRY_FULL_IMAGE",push=true \
        --export-cache type=inline \
        2>&1
      echo "镜像构建并推送成功: $CI_REGISTRY_FULL_IMAGE"
  needs: ["package"]
