# ============================================
# 单体 Java 项目 Docker 镜像构建模板 (Harbor 版本)
# ============================================
# 适用场景: 单体 Java 项目,使用 Harbor 镜像仓库
# 与 common_java/build.yaml 的区别:
#   - 镜像仓库: Harbor (harbor-ui.test.com)
#   - 使用 DOCKER_AUTH_CONFIG 认证 (而非 docker login)
#   - 支持 Harbor TLS (自签名证书)

.docker_build_harbor:
  stage: build
  image: docker:24.0.7-dind
  services:
    - docker:24.0.7-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_AUTH_CONFIG: '{"auths":{"harbor-ui.test.com":{"auth":"YWRtaW46SGFyYm9yMTIzNDU="}}}'
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  before_script:
    - |
      echo "========================================="
      echo "Docker 镜像构建 (Harbor 模式)"
      echo "时间: $(date +'%Y-%m-%d %H:%M:%S')"
      echo "========================================="
      # 计算镜像标签
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG=$CI_COMMIT_TAG
        echo "正式发布 - 使用 Tag: $IMAGE_TAG"
      else
        IMAGE_TAG="${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
        echo "非生产环境 - 使用分支标签: $IMAGE_TAG"
      fi
      export IMAGE_TAG
      # 镜像地址
      CI_REGISTRY_FULL_IMAGE="$CI_REGISTRY/$CI_REGISTRY_IMAGE:$IMAGE_TAG"
      echo "镜像地址: $CI_REGISTRY_FULL_IMAGE"
      echo "=== DOCKER_AUTH_CONFIG 诊断 ==="
      if [ -n "$DOCKER_AUTH_CONFIG" ]; then
        echo "DOCKER_AUTH_CONFIG 已设置 (长度: ${#DOCKER_AUTH_CONFIG})"
        echo "~/.docker/config.json:"
        cat ~/.docker/config.json 2>/dev/null || echo "  文件不存在"
      else
        echo "DOCKER_AUTH_CONFIG 未设置!"
      fi
      echo "=============================="
      # 诊断: 检查 dind service 网络和端口
      echo "=== 诊断: dind service 状态 ==="
      echo "Pod 内 /etc/hosts:"
      cat /etc/hosts | grep docker || echo "(无 docker 条目)"
      echo "端口探测: docker:2375"
      (echo >/dev/tcp/docker/2375) 2>/dev/null && echo "端口 2375: 开放" || echo "端口 2375: 关闭"
      echo "=============================="
      # 等待 Docker daemon 就绪(dind service 启动需要时间)
      echo "等待 Docker daemon 就绪..."
      WAIT_MAX=60
      for i in $(seq 1 $WAIT_MAX); do
        if docker info > /dev/null 2>&1; then
          echo "Docker daemon 就绪 (耗时 ${i}s)"
          break
        fi
        if [ $i -eq $WAIT_MAX ]; then
          echo "错误: Docker daemon 等待超时 (${WAIT_MAX}s)"
          echo "尝试直接连接获取更多错误信息..."
          docker info 2>&1 || true
          exit 1
        fi
        sleep 2
      done
      docker version
  script:
    - |
      # 计算镜像路径
      CI_REGISTRY_FULL_IMAGE="$CI_REGISTRY/$CI_REGISTRY_IMAGE:$IMAGE_TAG"
      # 构建镜像
      # APP_MAVEN_PATH: 单体项目子模块路径(可选),为空时用当前目录
      BUILD_CONTEXT="${APP_MAVEN_PATH:-.}"
      DOCKERFILE_PATH_CALC="$BUILD_CONTEXT/src/main/docker/Dockerfile"
      [ -f "$DOCKERFILE_PATH_CALC" ] || DOCKERFILE_PATH_CALC="Dockerfile"
      echo "Dockerfile: $DOCKERFILE_PATH_CALC"
      echo "Build Context: $BUILD_CONTEXT"
      docker build \
        --force-rm \
        --build-arg BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
        --build-arg VCS_REF=$CI_COMMIT_SHA \
        --build-arg VERSION=$IMAGE_TAG \
        -f "$DOCKERFILE_PATH_CALC" \
        -t "$CI_REGISTRY_FULL_IMAGE" \
        "$BUILD_CONTEXT"
      # 推送镜像 (指数退避重试)
      PUSH_SUCCESS=false
      for i in 1 2 3; do
        echo "推送尝试 $i/3..."
        if docker push "$CI_REGISTRY_FULL_IMAGE"; then
          PUSH_SUCCESS=true
          break
        else
          if [ $i -eq 3 ]; then
            echo "推送失败,已达最大重试次数"
          else
            SLEEP=$((2 ** i))
            echo "推送失败,${SLEEP}秒后重试..."
            sleep $SLEEP
          fi
        fi
      done
      if [ "$PUSH_SUCCESS" = true ]; then
        echo "镜像推送成功: $CI_REGISTRY_FULL_IMAGE"
      else
        exit 1
      fi
  needs: ["package"]
