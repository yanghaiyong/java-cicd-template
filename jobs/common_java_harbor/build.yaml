.docker_build_harbor:
  stage: build
  image: harbor-ui.test.com/library/buildkit:rootless
  variables:
    DOCKER_CONFIG: /tmp/docker-config
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  before_script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG=$CI_COMMIT_TAG
      else
        IMAGE_TAG="${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
      fi
      export IMAGE_TAG
      export CI_REGISTRY_FULL_IMAGE="$CI_REGISTRY/$CI_REGISTRY_IMAGE:$IMAGE_TAG"
      export SSL_CERT_FILE=/etc/docker/certs.d/harbor-ui.test.com/ca.crt
      mkdir -p "$HOME/.config/buildkit/certs/harbor-ui.test.com"
      cp /etc/docker/certs.d/harbor-ui.test.com/ca.crt \
         "$HOME/.config/buildkit/certs/harbor-ui.test.com/ca.crt"
      mkdir -p "$DOCKER_CONFIG"
      AUTH=$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 -w0)
      printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$AUTH" > "$DOCKER_CONFIG/config.json"
      mkdir -p "$HOME/.docker"
      cp "$DOCKER_CONFIG/config.json" "$HOME/.docker/config.json"
  script:
    - |
      echo "========================================="
      echo "Phase 1: Building image to OCI tar..."
      echo "========================================="
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context="${APP_MAVEN_PATH:-.}" \
        --local dockerfile="$(dirname "${APP_MAVEN_PATH:-.}/src/main/docker/Dockerfile")" \
        --opt filename="$(basename "${APP_MAVEN_PATH:-.}/src/main/docker/Dockerfile")" \
        --opt build-arg:BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
        --opt build-arg:VCS_REF=$CI_COMMIT_SHA \
        --opt build-arg:VERSION=$IMAGE_TAG \
        --output type=oci,name="$CI_REGISTRY_FULL_IMAGE",dest=/tmp/image.tar \
        --export-cache type=inline \
        2>&1
      echo "Build done: $(du -h /tmp/image.tar | cut -f1)"
    - |
      echo "========================================="
      echo "Phase 2: Pushing to Harbor via v2 API..."
      echo "========================================="
      # Use curl if available, else wget
      command -v curl >/dev/null 2>&1 && HTTP_CMD="curl" || HTTP_CMD="wget"
      echo "Using: $HTTP_CMD"

      REGISTRY="$CI_REGISTRY"
      REPO="$CI_REGISTRY_IMAGE"
      TAG="$IMAGE_TAG"
      USER="$CI_REGISTRY_USER"
      PASS="$CI_REGISTRY_PASSWORD"
      CREDS=$(printf '%s:%s' "$USER" "$PASS" | base64 -w0)

      # Get bearer token from Harbor token endpoint
      TOKEN=$(wget -qO- --header="Authorization: Basic $CREDS" \
        "https://${REGISTRY}/service/token?service=harbor-registry&scope=repository:${REPO}:pull,push" \
        | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
      if [ -z "$TOKEN" ]; then
        echo "ERROR: failed to obtain token" >&2
        exit 1
      fi
      echo "Got token (${#TOKEN} chars)"
      BEARER="Authorization: Bearer $TOKEN"

      # Extract manifest, config digest, and layer digests from OCI tar
      cd /tmp || { echo "ERROR: cd /tmp failed"; exit 1; }
      rm -rf oci-extract
      mkdir -p oci-extract && cd oci-extract
      tar -xf /tmp/image.tar 2>&1 || { echo "ERROR: tar extraction failed"; exit 1; }
      echo "Extracted files:"
      ls -la
      echo "blobs dir:"
      ls blobs/
      echo "blobs/sha256 dir (with sizes):"
      ls -la blobs/sha256/
      echo "All files in extracted dir:"
      find . -type f
      echo "index.json:"
      cat index.json
      echo ""
      echo "Content of blobs/sha256/* (first 200 chars each):"
      for f in blobs/sha256/*; do
        echo "=== $f ($(wc -c < "$f") bytes) ==="
        head -c 200 "$f"
        echo ""
      done
      M_DIGEST=$(cat index.json | sed -n 's/.*"digest":"\([^"]*\)".*/\1/p' | head -1)
      echo "M_DIGEST: $M_DIGEST"
      # Strip algorithm prefix to get hex-only path (blobs/sha256/<hex>, not blobs/sha256/sha256:<hex>)
      M_HEX="${M_DIGEST#sha256:}"
      echo "M_HEX: $M_HEX"
      echo "Looking for manifest blob..."
      if [ -f "blobs/sha256/${M_HEX}" ]; then
        cp "blobs/sha256/${M_HEX}" manifest.json
        echo "Found at blobs/sha256/${M_HEX}"
      elif [ -f "blobs/sha256/${M_DIGEST}" ]; then
        cp "blobs/sha256/${M_DIGEST}" manifest.json
        echo "Found at blobs/sha256/${M_DIGEST}"
      else
        echo "ERROR: manifest blob not found at blobs/sha256/${M_HEX} or blobs/sha256/${M_DIGEST}"
        echo "Available blobs:"
        ls -la blobs/sha256/
        exit 1
      fi
      echo "manifest.json:"
      cat manifest.json
      echo ""
      CONFIG_DIGEST=$(sed -n 's/.*"config":{"digest":"\([^"]*\)".*/\1/p' manifest.json)
      # Collect layer digests; strip sha256: prefix for filesystem paths
      LAYER_DIGESTS=$(sed -n 's/.*"digest":"\([^"]*\)".*/\1/p' manifest.json \
        | grep -v "^${CONFIG_DIGEST}$" | grep -v "^${M_DIGEST}$" \
        | sed 's/^sha256://')
      echo "Manifest digest: $M_DIGEST"
      echo "Config digest: $CONFIG_DIGEST (hex: ${CONFIG_DIGEST#sha256:})"
      echo "Layers: $(echo "$LAYER_DIGESTS" | wc -l)"

      # Upload each blob
      upload_blob() {
        local digest="$1"  # full digest like sha256:<hex>
        local hex="${digest#sha256:}"
        # Check if blob exists (HEAD)
        HEAD_CODE=$(curl -sk -o /dev/null -w "%{http_code}" \
          -H "$BEARER" \
          "https://${REGISTRY}/v2/${REPO}/blobs/${digest}" 2>/dev/null || echo "000")
        if [ "$HEAD_CODE" = "200" ]; then
          echo "  [skip] $digest exists"
          return 0
        fi
        # Monolithic upload via POST with ?digest query (single-request)
        LOC="https://${REGISTRY}/v2/${REPO}/blobs/uploads/?digest=${digest}"
        echo "  [upload] $digest"
        curl -sk -X POST \
          -H "$BEARER" \
          -H "Content-Type: application/octet-stream" \
          --data-binary "@blobs/sha256/${hex}" \
          "$LOC"
        echo ""
      }
        echo "  [upload] $digest -> $LOC"
        curl -sk -X PUT \
          -H "$BEARER" \
          -H "Content-Type: application/octet-stream" \
          --data-binary "@${file}" \
          "$LOC"
        echo ""
      }

      # Upload config
      upload_blob "$CONFIG_DIGEST" "blobs-raw/${CONFIG_DIGEST}"

      # Upload layers
      for d in $LAYER_DIGESTS; do
        upload_blob "$d" "blobs-raw/${d}"
      done

      # Push manifest
      echo "Pushing manifest..."
      MTYPE=$(sed -n 's/.*"mediaType":"\([^"]*\)".*/\1/p' manifest.json | head -1)
      MTYPE=${MTYPE:-application/vnd.oci.image.manifest.v1+json}
      curl -sk -X PUT \
        -H "$BEARER" \
        -H "Content-Type: ${MTYPE}" \
        --data-binary "@manifest.json" \
        "https://${REGISTRY}/v2/${REPO}/manifests/${TAG}"
      echo ""
      echo "Push complete: ${CI_REGISTRY_FULL_IMAGE}"
  needs: ["package"]