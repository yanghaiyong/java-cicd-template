.docker_build_harbor:
  stage: build
  image: harbor-ui.test.com/library/buildkit:rootless
  variables:
    DOCKER_CONFIG: /tmp/docker-config
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  before_script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG=$CI_COMMIT_TAG
      else
        IMAGE_TAG="${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
      fi
      export IMAGE_TAG
      export CI_REGISTRY_FULL_IMAGE="$CI_REGISTRY/$CI_REGISTRY_IMAGE:$IMAGE_TAG"
      export SSL_CERT_FILE=/etc/docker/certs.d/harbor-ui.test.com/ca.crt
      mkdir -p "$HOME/.config/buildkit/certs/harbor-ui.test.com"
      cp /etc/docker/certs.d/harbor-ui.test.com/ca.crt \
         "$HOME/.config/buildkit/certs/harbor-ui.test.com/ca.crt"
      mkdir -p "$DOCKER_CONFIG"
      AUTH=$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 -w0)
      printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$AUTH" > "$DOCKER_CONFIG/config.json"
      mkdir -p "$HOME/.docker"
      cp "$DOCKER_CONFIG/config.json" "$HOME/.docker/config.json"
  script:
    - |
      echo "========================================="
      echo "Phase 1: Building image to OCI tar..."
      echo "========================================="
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context="${APP_MAVEN_PATH:-.}" \
        --local dockerfile="$(dirname "${APP_MAVEN_PATH:-.}/src/main/docker/Dockerfile")" \
        --opt filename="$(basename "${APP_MAVEN_PATH:-.}/src/main/docker/Dockerfile")" \
        --opt build-arg:BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
        --opt build-arg:VCS_REF=$CI_COMMIT_SHA \
        --opt build-arg:VERSION=$IMAGE_TAG \
        --output type=oci,name="$CI_REGISTRY_FULL_IMAGE",dest=/tmp/image.tar \
        --export-cache type=inline \
        2>&1
      echo "Build done: $(du -h /tmp/image.tar | cut -f1)"
    - |
      echo "========================================="
      echo "Phase 2: Pushing to Harbor via v2 API..."
      echo "========================================="
      REGISTRY="$CI_REGISTRY"
      REPO="$CI_REGISTRY_IMAGE"
      TAG="$IMAGE_TAG"
      USER="$CI_REGISTRY_USER"
      PASS="$CI_REGISTRY_PASSWORD"
      CREDS=$(printf '%s:%s' "$USER" "$PASS" | base64 -w0)

      TOKEN_RESP=$(wget -qO- --header="Authorization: Basic $CREDS" \
        "https://${REGISTRY}/service/token?service=harbor-registry&scope=repository:${REPO}:pull,push" 2>/dev/null) || true
      TOKEN=$(echo "$TOKEN_RESP" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
      if [ -z "$TOKEN" ]; then
        echo "ERROR: failed to obtain token. Response: $TOKEN_RESP" >&2
        exit 1
      fi
      echo "Got token (${#TOKEN} chars)"
      BEARER="Authorization: Bearer $TOKEN"

      echo "Step: cd /tmp"
      cd /tmp || { echo "ERROR: cd /tmp failed"; exit 1; }
      echo "Step: extract tar"
      rm -rf oci-extract
      mkdir -p oci-extract && cd oci-extract
      tar -xf /tmp/image.tar 2>&1 || { echo "ERROR: tar extraction failed"; exit 1; }
      echo "Step: extract manifest digest"

      M_DIGEST=$(cat index.json | sed -n 's/.*"digest":"\([^"]*\)".*/\1/p' | head -1)
      M_HEX="${M_DIGEST#sha256:}"
      if [ -f "blobs/sha256/${M_HEX}" ]; then
        cp "blobs/sha256/${M_HEX}" manifest.json
      else
        echo "ERROR: manifest blob not found at blobs/sha256/${M_HEX}"
        exit 1
      fi

      # Extract digest fields directly with grep -o (handles pretty-printed JSON naturally)
      CONFIG_DIGEST=$(grep -o '"digest": "[^"]*"' manifest.json | head -1 | sed 's/.*"\(sha256:[^"]*\)"/\1/')
      ALL_DIGESTS=$(grep -o '"digest": "[^"]*"' manifest.json | sed 's/.*"\(sha256:[^"]*\)"/\1/')
      LAYER_HEXES=$(echo "$ALL_DIGESTS" | grep -v "^${CONFIG_DIGEST}$" | sed 's/^sha256://')
      echo "Manifest digest: $M_DIGEST"
      echo "Config digest: $CONFIG_DIGEST"
      echo "Layers: $(echo "$LAYER_HEXES" | grep -c .)"

      # Upload each blob using wget (buildkit:rootless has no curl)
      upload_blob() {
        local digest="$1"
        local hex="${digest#sha256:}"
        # Check if blob exists via HEAD (wget --spider returns 0 if exists)
        if wget --spider -q --no-check-certificate \
          --header="$BEARER" \
          "https://${REGISTRY}/v2/${REPO}/blobs/${digest}" 2>/dev/null; then
          echo "  [skip] $digest"
          return 0
        fi
        URL="https://${REGISTRY}/v2/${REPO}/blobs/uploads/?digest=${digest}"
        echo -n "  [upload] $digest ... "
        # BusyBox wget has no --method/--body-file; --post-file implicitly uses POST
        UPLOAD_OUT=$(wget --no-check-certificate \
          --header="$BEARER" \
          --header="Content-Type: application/octet-stream" \
          --post-file="blobs/sha256/${hex}" \
          "$URL" 2>&1) || UPLOAD_RC=$?
        UPLOAD_RC=${UPLOAD_RC:-0}
        if [ "$UPLOAD_RC" = "0" ]; then
          echo "OK"
        else
          echo "FAILED (rc=$UPLOAD_RC)"
          echo "  output: $UPLOAD_OUT" | head -3
          return 1
        fi
      }

      upload_blob "$CONFIG_DIGEST"
      for d in $LAYER_HEXES; do
        upload_blob "sha256:${d}"
      done

      echo "Pushing manifest via openssl (BusyBox wget has no PUT)..."
      MTYPE=$(grep -o '"mediaType": "[^"]*"' manifest.json | head -1 | sed 's/.*"\(application[^"]*\)".*/\1/')
      MTYPE=${MTYPE:-application/vnd.oci.image.manifest.v1+json}
      HOST_PORT="${REGISTRY}"
      MANIFEST_PATH="/v2/${REPO}/manifests/${TAG}"
      BODY_SIZE=$(wc -c < manifest.json)
      # Check openssl availability
      if ! command -v openssl >/dev/null 2>&1; then
        echo "ERROR: openssl not found in image, cannot do PUT"
        exit 1
      fi
      # Write HTTP headers to temp file, then concatenate body to avoid pipe SIGPIPE
      HDR_FILE=$(mktemp)
      printf 'PUT %s HTTP/1.1\r\nHost: %s\r\nAuthorization: Bearer %s\r\nContent-Type: %s\r\nContent-Length: %d\r\nConnection: close\r\n\r\n' \
        "$MANIFEST_PATH" "$HOST_PORT" "$TOKEN" "$MTYPE" "$BODY_SIZE" > "$HDR_FILE"
      PUSH_OUT=$(cat "$HDR_FILE" manifest.json | openssl s_client -connect "${HOST_PORT}:443" 2>&1) || PUSH_RC=$?
      PUSH_RC=${PUSH_RC:-0}
      rm -f "$HDR_FILE"
      echo "openssl response (first 10 lines):"
      echo "$PUSH_OUT" | grep -v "verify\|depth=" | head -10
      if echo "$PUSH_OUT" | grep -qE "HTTP/1\.[01] 20[0-9]"; then
        echo "Manifest pushed OK"
      else
        echo "Manifest FAILED (rc=$PUSH_RC)"
        exit 1
      fi
      echo "Push complete: ${CI_REGISTRY_FULL_IMAGE}"
  needs: ["package"]