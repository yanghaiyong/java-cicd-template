# ============================================
# Java 项目 Trivy 镜像扫描模板 (Harbor 版本)
# ============================================
# 适用场景: Java 项目,使用 Harbor 镜像仓库
# 无需 Docker daemon, 直接用 trivy 镜像扫描远程镜像

.trivy_scan_harbor:
  stage: scan
  image: $TRIVY_IMAGE
  variables:
    DOCKER_CONFIG: /tmp/docker-config
    # 离线环境: 漏洞库经 daocloud 代理拉取(集群不可直连 ghcr.io / mirror.gcr.io)
    TRIVY_DB_REPOSITORY: docker.m.daocloud.io/aquasec/trivy-db:2
    TRIVY_JAVA_DB_REPOSITORY: docker.m.daocloud.io/aquasec/trivy-java-db:1
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_pending_with_matching_runners
      - stuck_pending_no_matching_runners
      - no_updates_running
      - no_updates_canceling
      - server_timeout_running
      - server_timeout_canceling
  before_script:
    - |
      echo "========================================="
      echo "Trivy 安全扫描 (Harbor 模式)"
      echo "时间: $(date +'%Y-%m-%d %H:%M:%S')"
      echo "========================================="
      # 配置 Harbor 认证 (trivy 需要读取 config.json 来认证 Harbor)
      mkdir -p "$DOCKER_CONFIG"
      if [ -n "$DOCKER_AUTH_CONFIG" ]; then
        echo "$DOCKER_AUTH_CONFIG" > "$DOCKER_CONFIG/config.json"
        echo "Harbor 认证已配置"
      else
        echo "警告: 未配置 DOCKER_AUTH_CONFIG, 扫描可能失败"
      fi
      # Trivy(Go) 走系统信任库, 不读 /etc/docker/certs.d → 把 Harbor CA 并入系统 CA bundle
      if [ -f "/etc/docker/certs.d/$CI_REGISTRY/ca.crt" ] && [ -f /etc/ssl/certs/ca-certificates.crt ]; then
        cat /etc/ssl/certs/ca-certificates.crt "/etc/docker/certs.d/$CI_REGISTRY/ca.crt" > /tmp/ca-bundle.crt
        export SSL_CERT_FILE=/tmp/ca-bundle.crt
        echo "已并入 Harbor CA 到信任库"
      fi
  script:
    - |
      # 镜像标签
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG=$CI_COMMIT_TAG
      else
        IMAGE_TAG="${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
      fi
      CI_REGISTRY_FULL_IMAGE="$CI_REGISTRY/$CI_REGISTRY_IMAGE:$IMAGE_TAG"
      echo "扫描镜像: $CI_REGISTRY_FULL_IMAGE"
      # 宽松模式: 仅报告不阻断
      trivy image \
        --severity CRITICAL,HIGH \
        --no-progress \
        --exit-code 0 \
        "$CI_REGISTRY_FULL_IMAGE"
      echo "扫描完成"
