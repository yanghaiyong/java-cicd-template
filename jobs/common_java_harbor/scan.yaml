# ============================================
# 单体 Java 项目 Trivy 镜像扫描模板 (Harbor 版本)
# ============================================
# 适用场景: 单体 Java 项目,使用 Harbor 镜像仓库

.trivy_scan_harbor:
  stage: scan
  image: docker:24.0.7-dind
  services:
    - docker:24.0.7-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  before_script:
    - |
      echo "========================================="
      echo "Trivy 安全扫描 (Harbor 模式)"
      echo "时间: $(date +'%Y-%m-%d %H:%M:%S')"
      echo "========================================="
  script:
    - |
      # 镜像标签
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG=$CI_COMMIT_TAG
      else
        IMAGE_TAG="${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
      fi
      CI_REGISTRY_FULL_IMAGE="$CI_REGISTRY/$CI_REGISTRY_IMAGE:$IMAGE_TAG"
      echo "扫描镜像: $CI_REGISTRY_FULL_IMAGE"
      # 宽松模式: 仅报告不阻断
      docker run --rm aquasec/trivy:latest \
        image \
        --severity CRITICAL,HIGH \
        --no-progress \
        --exit-code 0 \
        "$CI_REGISTRY_FULL_IMAGE"
      echo "扫描完成"
  needs: ["build"]
