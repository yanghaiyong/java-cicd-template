# ============================================
# 单体 Java 项目 K8s 部署模板 (Harbor 版本)
# ============================================
# 适用场景: 单体 Java 项目,使用 Harbor 镜像仓库
# 与 common_java/deploy.yaml 的区别:
#   - 镜像路径: $CI_REGISTRY/$CI_REGISTRY_IMAGE:$TAG
#   - 支持 Harbor 镜像拉取 Secret

.k8s_deploy_harbor:
  stage: deploy
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      variables:
        K8S_ENV: "dev"
        K8S_NAMESPACE: "app-dev"
    - if: '$CI_COMMIT_BRANCH == "test"'
      variables:
        K8S_ENV: "test"
        K8S_NAMESPACE: "app-test"
    - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main"'
      variables:
        K8S_ENV: "pre-prod"
        K8S_NAMESPACE: "app-pre-prod"
    - if: '$CI_COMMIT_TAG'
      variables:
        K8S_ENV: "prod"
        K8S_NAMESPACE: "app-prod"
  before_script:
    - |
      echo "========================================="
      echo "K8s 部署 (Harbor 模式)"
      echo "环境: $K8S_ENV | Namespace: $K8S_NAMESPACE"
      echo "时间: $(date +'%Y-%m-%d %H:%M:%S')"
      echo "========================================="
      # kubectl is pre-installed in the Harbor-hosted image
      kubectl version --client
      # Kubeconfig 认证
      if [ -n "$KUBECONFIG_CONTEXT" ]; then
        echo "使用 KUBECONFIG_CONTEXT: $KUBECONFIG_CONTEXT"
        export KUBECONFIG=""
        kubectl config use-context $KUBECONFIG_CONTEXT
      elif [ -n "$KUBECONFIG_CONTENT" ]; then
        printf '%s' "$KUBECONFIG_CONTENT" | base64 -d > /tmp/kubeconfig
        chmod 600 /tmp/kubeconfig
        export KUBECONFIG=/tmp/kubeconfig
      else
        echo "错误: KUBECONFIG_CONTEXT 或 KUBECONFIG_CONTENT 未配置"
        exit 1
      fi
      kubectl version --client
  script:
    - |
      export K8S_YAML="${APP_MAVEN_PATH:+$APP_MAVEN_PATH/}${K8S_BASE_PATH}/${K8S_ENV}/${K8S_FILE}"
      # 镜像标签
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG=$CI_COMMIT_TAG
      else
        IMAGE_TAG="${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
      fi
      CI_REGISTRY_FULL_IMAGE="$CI_REGISTRY/$CI_REGISTRY_IMAGE:$IMAGE_TAG"
      echo "部署镜像: $CI_REGISTRY_FULL_IMAGE"
      # ${IMAGE_PULL_SECRETS} 由模板变量提供; ${DOCKER_CONFIG} 按 CI 凭据在此生成
      DOCKER_CONFIG=$(printf '{"auths":{"%s":{"username":"%s","password":"%s","auth":"%s"}}}' \
        "$CI_REGISTRY" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" \
        "$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')" | base64 | tr -d '\n')
      echo "K8s YAML: $K8S_YAML"
      # 检查 K8s YAML
      if [ ! -f "$K8S_YAML" ]; then
        echo "错误: K8s YAML 不存在: $K8S_YAML"
        exit 1
      fi
      # 创建 Harbor Secret (如果不存在)
      if ! kubectl get secret "${IMAGE_PULL_SECRETS}" -n ${K8S_NAMESPACE} >/dev/null 2>&1; then
        kubectl create secret docker-registry "${IMAGE_PULL_SECRETS}" \
          --docker-server=$CI_REGISTRY \
          --docker-username=$CI_REGISTRY_USER \
          --docker-password=$CI_REGISTRY_PASSWORD \
          -n ${K8S_NAMESPACE}
      fi
      # sed 替换 manifest 中所有占位符(变量默认值见 templates/java-pipeline-harbor.yaml)
      for v in APP_NAME K8S_NAMESPACE CI_REGISTRY_FULL_IMAGE IMAGE_TAG IMAGE_PULL_SECRETS DOCKER_CONFIG \
               SERVICE_TYPE SERVICE_PORT CONTAINER_PORT IMAGE_PULL_POLICY REPLICAS MAX_SURGE MAX_UNAVAILABLE \
               MEMORY_REQUEST MEMORY_LIMIT CPU_REQUEST CPU_LIMIT HEALTH_CHECK_PATH \
               LIVENESS_INITIAL_DELAY READINESS_INITIAL_DELAY JAVA_MIN_HEAP JAVA_MAX_HEAP \
               HPA_MIN_REPLICAS HPA_MAX_REPLICAS HPA_CPU_THRESHOLD HPA_MEMORY_THRESHOLD; do
        eval "val=\${$v}"
        if [ -n "$val" ]; then
          sed -i "s|\${$v}|$val|g" $K8S_YAML
        fi
      done
      # 部署
      if kubectl apply -f $K8S_YAML -n ${K8S_NAMESPACE}; then
        echo "部署成功,等待就绪..."
        if kubectl rollout status deployment/${APP_NAME} -n ${K8S_NAMESPACE} --timeout=300s; then
          echo "应用已就绪"
        else
          echo "部署失败: rollout 未就绪,输出诊断信息"
          kubectl describe deployment/${APP_NAME} -n ${K8S_NAMESPACE} | tail -30
          kubectl get pods -n ${K8S_NAMESPACE} -l app=${APP_NAME} -o wide
          kubectl get events -n ${K8S_NAMESPACE} --sort-by=.lastTimestamp | tail -20
          exit 1
        fi
      else
        echo "部署失败"
        exit 1
      fi
      echo "部署完成!"
      kubectl get deployments -n ${K8S_NAMESPACE}
      kubectl get pods -n ${K8S_NAMESPACE} -l app=${APP_NAME}
  needs: ["build"]
