# ============================================
# 单体 Java 项目测试模板 (Harbor 版本)
# ============================================
# 适用场景: 单体 Java 项目,使用 Harbor 镜像仓库
# 与 common_java/test.yaml 的区别:
#   - 无变化, 测试与镜像仓库无关

.test_harbor:
  stage: test
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  before_script:
    - |
      echo "========================================="
      echo "单元测试 (Harbor 模式)"
      echo "时间: $(date +'%Y-%m-%d %H:%M:%S')"
      echo "========================================="
      mkdir -p .m2/repository
  script:
    - |
      echo "测试命令: $TEST_SHELL"
      $TEST_SHELL
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: target/surefire-reports/TEST-*.xml
      coverage_report:
        coverage_format: jacoco
        path: target/site/jacoco/jacoco.xml
    paths:
      - target/surefire-reports/
      - target/site/jacoco/
  cache:
    policy: pull-push
    key: "maven-$CI_COMMIT_REF_SLUG"
    paths:
      - .m2/repository
