# ============================================
# 聚合项目 (Maven Multi-Module) Trivy 镜像扫描模板 (Harbor 版本)
# ============================================
# 适用场景: 聚合项目,使用 Harbor 镜像仓库

.aggregate_trivy_scan:
  stage: scan
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_pending_with_matching_runners
      - stuck_pending_no_matching_runners
      - no_updates_running
      - no_updates_canceling
      - server_timeout_running
      - server_timeout_canceling
  before_script:
    - |
      echo "========================================="
      echo "Trivy 安全扫描 (Harbor 模式) - $APP_NAME"
      echo "时间: $(date +'%Y-%m-%d %H:%M:%S')"
      echo "========================================="
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG=$CI_COMMIT_TAG
      else
        IMAGE_TAG="${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
      fi
      CI_REGISTRY_FULL_IMAGE="$CI_REGISTRY/$CI_REGISTRY_IMAGE/$APP_NAME:$IMAGE_TAG"
      echo "扫描镜像: $CI_REGISTRY_FULL_IMAGE"
      docker run --rm aquasec/trivy:latest \
        image \
        --severity CRITICAL,HIGH \
        --no-progress \
        --exit-code 0 \
        "$CI_REGISTRY_FULL_IMAGE"
      echo "扫描完成"
  needs: ["build"]

.aggregate_trivy_scan_all:
  stage: scan
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_pending_with_matching_runners
      - stuck_pending_no_matching_runners
      - no_updates_running
      - no_updates_canceling
      - server_timeout_running
      - server_timeout_canceling
  before_script:
    - |
      echo "========================================="
      echo "Trivy 安全扫描(线性) - Harbor 模式"
      echo "App 列表: $DEPLOYABLE_APPS"
      echo "时间: $(date +'%Y-%m-%d %H:%M:%S')"
      echo "========================================="
  script:
    - |
      echo "逐个扫描所有应用的镜像..."
      for app_path in $DEPLOYABLE_APPS; do
        app_name=$(basename "$app_path")
        app_name_lower=$(echo "$app_name" | tr '[:upper:]' '[:lower:]')
        echo ""
        echo "========================================="
        echo "扫描: $app_name"
        echo "========================================="
        if [ -n "$CI_COMMIT_TAG" ]; then
          IMAGE_TAG=$CI_COMMIT_TAG
        else
          IMAGE_TAG="${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
        fi
        CI_REGISTRY_FULL_IMAGE="$CI_REGISTRY/$CI_REGISTRY_IMAGE/$app_name_lower:$IMAGE_TAG"
        echo "扫描镜像: $CI_REGISTRY_FULL_IMAGE"
        docker run --rm aquasec/trivy:latest \
          image \
          --severity CRITICAL,HIGH \
          --no-progress \
          --exit-code 0 \
          "$CI_REGISTRY_FULL_IMAGE" || true
        echo "扫描完成: $app_name"
      done
      echo ""
      echo "========================================="
      echo "全部扫描完成!"
      echo "========================================="
  needs: ["build"]
