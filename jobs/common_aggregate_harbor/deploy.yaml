# ============================================
# 聚合项目 (Maven Multi-Module) K8s 部署模板 (Harbor 版本)
# ============================================
# 适用场景: 聚合项目,使用 Harbor 镜像仓库
# 与 common_aggregate/deploy.yaml 的区别:
#   - 镜像路径: $CI_REGISTRY/$CI_REGISTRY_IMAGE/$APP_NAME:$TAG
#   - DOCKER_CONFIG 按项目级凭据生成 + 创建 Harbor imagePullSecret

# 单 app K8s 部署模板 (matrix 中每个 job 单独调用)
.aggregate_k8s_deploy:
  stage: deploy
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_pending_with_matching_runners
      - stuck_pending_no_matching_runners
      - no_updates_running
      - no_updates_canceling
      - server_timeout_running
      - server_timeout_canceling
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      variables:
        K8S_ENV: "dev"
        K8S_NAMESPACE: "app-dev"
    - if: '$CI_COMMIT_BRANCH == "test"'
      variables:
        K8S_ENV: "test"
        K8S_NAMESPACE: "app-test"
    - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main"'
      variables:
        K8S_ENV: "pre-prod"
        K8S_NAMESPACE: "app-pre-prod"
    - if: '$CI_COMMIT_TAG'
      variables:
        K8S_ENV: "prod"
        K8S_NAMESPACE: "app-prod"
  before_script:
    - |
      echo "========================================="
      echo "聚合项目 K8s 部署 - $APP_NAME"
      echo "环境: $K8S_ENV | Namespace: $K8S_NAMESPACE"
      echo "========================================="
      # 拼接 K8s YAML 路径: $APP_MAVEN_PATH/src/main/k8s/<env>/deploy.yaml
      export K8S_YAML="${APP_MAVEN_PATH}/${K8S_BASE_PATH}/${K8S_ENV}/${K8S_FILE}"
      echo "K8s YAML: $K8S_YAML"
      # Kubeconfig 认证 (context 优先, content 备用)
      if [ -n "$KUBECONFIG_CONTEXT" ]; then
        echo "使用 KUBECONFIG_CONTEXT: $KUBECONFIG_CONTEXT"
        export KUBECONFIG=""
        kubectl config use-context $KUBECONFIG_CONTEXT
      elif [ -n "$KUBECONFIG_CONTENT" ]; then
        echo "$KUBECONFIG_CONTENT" | base64 -d > /tmp/kubeconfig
        chmod 600 /tmp/kubeconfig
        export KUBECONFIG=/tmp/kubeconfig
      else
        echo "错误: KUBECONFIG_CONTEXT 或 KUBECONFIG_CONTENT 未配置"
        exit 1
      fi
      kubectl version --client
  script:
    - |
      export K8S_YAML="${APP_MAVEN_PATH}/${K8S_BASE_PATH}/${K8S_ENV}/${K8S_FILE}"

      # 镜像标签
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG=$CI_COMMIT_TAG
      else
        IMAGE_TAG="${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
      fi
      CI_REGISTRY_IMAGE_FULL="$CI_REGISTRY_IMAGE/$APP_NAME"
      CI_REGISTRY_FULL_IMAGE="$CI_REGISTRY/$CI_REGISTRY_IMAGE_FULL:$IMAGE_TAG"
      echo "部署镜像: $CI_REGISTRY_FULL_IMAGE"
      # K8s 资源名必须全小写(RFC1123)
      APP_NAME_LOWER=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]')

      # ${IMAGE_PULL_SECRETS} 由模板变量提供; ${DOCKER_CONFIG} 按 Harbor 凭据在此生成
      DOCKER_CONFIG=$(printf '{"auths":{"%s":{"username":"%s","password":"%s","auth":"%s"}}}' \
        "$CI_REGISTRY" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" \
        "$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')" | base64 | tr -d '\n')

      # 检查 K8s YAML
      if [ ! -f "$K8S_YAML" ]; then
        echo "错误: K8s YAML 不存在: $K8S_YAML"
        exit 1
      fi

      # 创建 Harbor Secret (如果不存在)
      if ! kubectl get secret "${IMAGE_PULL_SECRETS}" -n ${K8S_NAMESPACE} >/dev/null 2>&1; then
        kubectl create secret docker-registry "${IMAGE_PULL_SECRETS}" \
          --docker-server=$CI_REGISTRY \
          --docker-username=$CI_REGISTRY_USER \
          --docker-password=$CI_REGISTRY_PASSWORD \
          -n ${K8S_NAMESPACE}
      fi

      # sed 替换所有变量 (与 common_java/deploy.yaml 完全一致)
      if [ -z "$DOCKER_CONFIG" ]; then
        sed -i "/^---$/,/^kind: Secret/d" $K8S_YAML
        sed -i "/imagePullSecrets:/d" $K8S_YAML
      else
        sed -i "s|\${IMAGE_PULL_SECRETS}|$IMAGE_PULL_SECRETS|g" $K8S_YAML
        sed -i "s|\${DOCKER_CONFIG}|$DOCKER_CONFIG|g" $K8S_YAML
      fi
      sed -i "s|\${APP_NAME}|$APP_NAME_LOWER|g" $K8S_YAML
      sed -i "s|\${K8S_NAMESPACE}|$K8S_NAMESPACE|g" $K8S_YAML
      sed -i "s|\${CI_REGISTRY_FULL_IMAGE}|$CI_REGISTRY_FULL_IMAGE|g" $K8S_YAML
      sed -i "s|\${IMAGE_TAG}|$IMAGE_TAG|g" $K8S_YAML
      sed -i "s|\${SERVICE_TYPE}|$SERVICE_TYPE|g" $K8S_YAML
      sed -i "s|\${SERVICE_PORT}|$SERVICE_PORT|g" $K8S_YAML
      sed -i "s|\${CONTAINER_PORT}|$CONTAINER_PORT|g" $K8S_YAML
      sed -i "s|\${IMAGE_PULL_POLICY}|$IMAGE_PULL_POLICY|g" $K8S_YAML
      sed -i "s|\${REPLICAS}|$REPLICAS|g" $K8S_YAML
      sed -i "s|\${MAX_SURGE}|$MAX_SURGE|g" $K8S_YAML
      sed -i "s|\${MAX_UNAVAILABLE}|$MAX_UNAVAILABLE|g" $K8S_YAML
      sed -i "s|\${MEMORY_REQUEST}|$MEMORY_REQUEST|g" $K8S_YAML
      sed -i "s|\${CPU_REQUEST}|$CPU_REQUEST|g" $K8S_YAML
      sed -i "s|\${MEMORY_LIMIT}|$MEMORY_LIMIT|g" $K8S_YAML
      sed -i "s|\${CPU_LIMIT}|$CPU_LIMIT|g" $K8S_YAML
      sed -i "s|\${HEALTH_CHECK_PATH}|$HEALTH_CHECK_PATH|g" $K8S_YAML
      sed -i "s|\${LIVENESS_INITIAL_DELAY}|$LIVENESS_INITIAL_DELAY|g" $K8S_YAML
      sed -i "s|\${READINESS_INITIAL_DELAY}|$READINESS_INITIAL_DELAY|g" $K8S_YAML
      sed -i "s|\${HPA_MIN_REPLICAS}|$HPA_MIN_REPLICAS|g" $K8S_YAML
      sed -i "s|\${HPA_MAX_REPLICAS}|$HPA_MAX_REPLICAS|g" $K8S_YAML
      sed -i "s|\${HPA_CPU_THRESHOLD}|$HPA_CPU_THRESHOLD|g" $K8S_YAML
      sed -i "s|\${HPA_MEMORY_THRESHOLD}|$HPA_MEMORY_THRESHOLD|g" $K8S_YAML
      sed -i "s|\${HPA_SCALE_DOWN_WINDOW}|$HPA_SCALE_DOWN_WINDOW|g" $K8S_YAML
      sed -i "s|\${JAVA_MIN_HEAP}|$JAVA_MIN_HEAP|g" $K8S_YAML
      sed -i "s|\${JAVA_MAX_HEAP}|$JAVA_MAX_HEAP|g" $K8S_YAML

      # dry-run 验证 YAML 语法
      echo "验证 YAML 语法..."
      if ! kubectl apply --dry-run=client -f $K8S_YAML -n ${K8S_NAMESPACE} >/dev/null 2>&1; then
        echo "错误: YAML 验证失败"
        kubectl apply --dry-run=client -f $K8S_YAML -n ${K8S_NAMESPACE} 2>&1 || true
        exit 1
      fi

      # 创建 namespace (如不存在; best-effort: 命名空间级 SA 无集群权限时跳过)
      if ! kubectl get namespace ${K8S_NAMESPACE} >/dev/null 2>&1; then
        kubectl create namespace ${K8S_NAMESPACE} || echo "警告: 无权限创建 namespace ${K8S_NAMESPACE}, 继续部署(假定已存在)"
      fi

      # 部署
      if kubectl apply -f $K8S_YAML -n ${K8S_NAMESPACE}; then
        echo "部署成功,等待就绪..."
        if kubectl rollout status deployment/${APP_NAME_LOWER} -n ${K8S_NAMESPACE} --timeout=300s; then
          echo "应用已就绪"
        else
          echo "部署失败: rollout 未就绪,输出诊断信息"
          kubectl describe deployment/${APP_NAME_LOWER} -n ${K8S_NAMESPACE} | tail -30
          kubectl get pods -n ${K8S_NAMESPACE} -l app=${APP_NAME_LOWER} -o wide
          kubectl get events -n ${K8S_NAMESPACE} --sort-by=.lastTimestamp | tail -20
          exit 1
        fi
      else
        echo "部署失败"
        exit 1
      fi

      echo "部署完成!"
      kubectl get deployments -n ${K8S_NAMESPACE}
      kubectl get pods -n ${K8S_NAMESPACE} -l app=${APP_NAME_LOWER}
  needs: ["build"]

# 全部 app 线性 K8s 部署模板 (顺序执行)
.aggregate_k8s_deploy_all:
  stage: deploy
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_pending_with_matching_runners
      - stuck_pending_no_matching_runners
      - no_updates_running
      - no_updates_canceling
      - server_timeout_running
      - server_timeout_canceling
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      variables:
        K8S_ENV: "dev"
        K8S_NAMESPACE: "app-dev"
    - if: '$CI_COMMIT_BRANCH == "test"'
      variables:
        K8S_ENV: "test"
        K8S_NAMESPACE: "app-test"
    - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main"'
      variables:
        K8S_ENV: "pre-prod"
        K8S_NAMESPACE: "app-pre-prod"
    - if: '$CI_COMMIT_TAG'
      variables:
        K8S_ENV: "prod"
        K8S_NAMESPACE: "app-prod"
  before_script:
    - |
      echo "========================================="
      echo "聚合项目 K8s 部署(线性) - App 列表: $DEPLOYABLE_APPS"
      echo "环境: $K8S_ENV | Namespace: $K8S_NAMESPACE"
      echo "时间: $(date +'%Y-%m-%d %H:%M:%S')"
      echo "========================================="
      # Kubeconfig 认证
      if [ -n "$KUBECONFIG_CONTEXT" ]; then
        echo "使用 KUBECONFIG_CONTEXT: $KUBECONFIG_CONTEXT"
        export KUBECONFIG=""
        kubectl config use-context $KUBECONFIG_CONTEXT
      elif [ -n "$KUBECONFIG_CONTENT" ]; then
        echo "$KUBECONFIG_CONTENT" | base64 -d > /tmp/kubeconfig
        chmod 600 /tmp/kubeconfig
        export KUBECONFIG=/tmp/kubeconfig
      else
        echo "错误: KUBECONFIG_CONTEXT 或 KUBECONFIG_CONTENT 未配置"
        exit 1
      fi
      kubectl version --client
  script:
    - |
      echo "逐个部署所有应用到 K8s..."
      failed_apps=""
      for app_path in $DEPLOYABLE_APPS; do
        app_name=$(basename "$app_path")
        # Docker 镜像名必须小写
        app_name_lower=$(echo "$app_name" | tr '[:upper:]' '[:lower:]')
        echo ""
        echo "========================================="
        echo "部署: $app_name ($app_path)"
        echo "========================================="

        # 拼接 K8s YAML 路径
        K8S_YAML="${app_path}/${K8S_BASE_PATH}/${K8S_ENV}/${K8S_FILE}"
        echo "K8s YAML: $K8S_YAML"

        # 检查 K8s YAML
        if [ ! -f "$K8S_YAML" ]; then
          echo "跳过: K8s YAML 不存在"
          continue
        fi

        # 镜像标签
        if [ -n "$CI_COMMIT_TAG" ]; then
          IMAGE_TAG=$CI_COMMIT_TAG
        else
          IMAGE_TAG="${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
        fi
        CI_REGISTRY_IMAGE_FULL="$CI_REGISTRY_IMAGE/$app_name_lower"
        CI_REGISTRY_FULL_IMAGE="$CI_REGISTRY/$CI_REGISTRY_IMAGE_FULL:$IMAGE_TAG"
        echo "部署镜像: $CI_REGISTRY_FULL_IMAGE"

        # ${IMAGE_PULL_SECRETS} 由模板变量提供; ${DOCKER_CONFIG} 按 Harbor 凭据在此生成
        DOCKER_CONFIG=$(printf '{"auths":{"%s":{"username":"%s","password":"%s","auth":"%s"}}}' \
          "$CI_REGISTRY" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" \
          "$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')" | base64 | tr -d '\n')

        # 创建 Harbor Secret (如果不存在)
        if ! kubectl get secret "${IMAGE_PULL_SECRETS}" -n ${K8S_NAMESPACE} >/dev/null 2>&1; then
          kubectl create secret docker-registry "${IMAGE_PULL_SECRETS}" \
            --docker-server=$CI_REGISTRY \
            --docker-username=$CI_REGISTRY_USER \
            --docker-password=$CI_REGISTRY_PASSWORD \
            -n ${K8S_NAMESPACE}
        fi

        # sed 替换变量 (使用原始 app_name 作为 APP_NAME)
        if [ -z "$DOCKER_CONFIG" ]; then
          sed -i "/^---$/,/^kind: Secret/d" $K8S_YAML
          sed -i "/imagePullSecrets:/d" $K8S_YAML
        else
          sed -i "s|\${IMAGE_PULL_SECRETS}|$IMAGE_PULL_SECRETS|g" $K8S_YAML
          sed -i "s|\${DOCKER_CONFIG}|$DOCKER_CONFIG|g" $K8S_YAML
        fi
        sed -i "s|\${APP_NAME}|$app_name_lower|g" $K8S_YAML
        sed -i "s|\${K8S_NAMESPACE}|$K8S_NAMESPACE|g" $K8S_YAML
        sed -i "s|\${CI_REGISTRY_FULL_IMAGE}|$CI_REGISTRY_FULL_IMAGE|g" $K8S_YAML
        sed -i "s|\${IMAGE_TAG}|$IMAGE_TAG|g" $K8S_YAML
        sed -i "s|\${SERVICE_TYPE}|$SERVICE_TYPE|g" $K8S_YAML
        sed -i "s|\${SERVICE_PORT}|$SERVICE_PORT|g" $K8S_YAML
        sed -i "s|\${CONTAINER_PORT}|$CONTAINER_PORT|g" $K8S_YAML
        sed -i "s|\${IMAGE_PULL_POLICY}|$IMAGE_PULL_POLICY|g" $K8S_YAML
        sed -i "s|\${REPLICAS}|$REPLICAS|g" $K8S_YAML
        sed -i "s|\${MAX_SURGE}|$MAX_SURGE|g" $K8S_YAML
        sed -i "s|\${MAX_UNAVAILABLE}|$MAX_UNAVAILABLE|g" $K8S_YAML
        sed -i "s|\${MEMORY_REQUEST}|$MEMORY_REQUEST|g" $K8S_YAML
        sed -i "s|\${CPU_REQUEST}|$CPU_REQUEST|g" $K8S_YAML
        sed -i "s|\${MEMORY_LIMIT}|$MEMORY_LIMIT|g" $K8S_YAML
        sed -i "s|\${CPU_LIMIT}|$CPU_LIMIT|g" $K8S_YAML
        sed -i "s|\${HEALTH_CHECK_PATH}|$HEALTH_CHECK_PATH|g" $K8S_YAML
        sed -i "s|\${LIVENESS_INITIAL_DELAY}|$LIVENESS_INITIAL_DELAY|g" $K8S_YAML
        sed -i "s|\${READINESS_INITIAL_DELAY}|$READINESS_INITIAL_DELAY|g" $K8S_YAML
        sed -i "s|\${HPA_MIN_REPLICAS}|$HPA_MIN_REPLICAS|g" $K8S_YAML
        sed -i "s|\${HPA_MAX_REPLICAS}|$HPA_MAX_REPLICAS|g" $K8S_YAML
        sed -i "s|\${HPA_CPU_THRESHOLD}|$HPA_CPU_THRESHOLD|g" $K8S_YAML
        sed -i "s|\${HPA_MEMORY_THRESHOLD}|$HPA_MEMORY_THRESHOLD|g" $K8S_YAML
        sed -i "s|\${HPA_SCALE_DOWN_WINDOW}|$HPA_SCALE_DOWN_WINDOW|g" $K8S_YAML
        sed -i "s|\${JAVA_MIN_HEAP}|$JAVA_MIN_HEAP|g" $K8S_YAML
        sed -i "s|\${JAVA_MAX_HEAP}|$JAVA_MAX_HEAP|g" $K8S_YAML

        # 部署
        if kubectl apply -f $K8S_YAML -n ${K8S_NAMESPACE}; then
          echo "已提交部署,等待就绪: $app_name (${app_name_lower})"
          if kubectl rollout status deployment/${app_name_lower} -n ${K8S_NAMESPACE} --timeout=300s; then
            echo "✓ 部署成功: $app_name"
          else
            echo "✗ 部署失败(rollout 未就绪): $app_name"
            kubectl describe deployment/${app_name_lower} -n ${K8S_NAMESPACE} 2>&1 | tail -30 || true
            kubectl get pods -n ${K8S_NAMESPACE} -l app=${app_name_lower} -o wide 2>&1 || true
            kubectl get events -n ${K8S_NAMESPACE} --sort-by=.lastTimestamp 2>&1 | tail -20 || true
            failed_apps="$failed_apps $app_name"
          fi
        else
          echo "✗ 部署失败: $app_name"
          failed_apps="$failed_apps $app_name"
        fi
      done

      echo ""
      echo "========================================="
      echo "部署汇总"
      echo "========================================="
      kubectl get deployments -n ${K8S_NAMESPACE}
      kubectl get pods -n ${K8S_NAMESPACE}
      if [ -n "$failed_apps" ]; then
        echo "失败的应用:$failed_apps"
        exit 1
      else
        echo "全部部署完成!"
      fi
  needs: ["build"]
