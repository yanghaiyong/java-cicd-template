# ============================================
# 聚合项目 (Maven Multi-Module) Docker 镜像构建模板 (Harbor 版本)
# ============================================
# 适用场景: 聚合项目,使用 Harbor 镜像仓库
# 与 common_aggregate/build.yaml 的区别:
#   - 镜像仓库: Harbor (harbor-ui.test.com)
#   - 使用 DOCKER_AUTH_CONFIG 认证
#   - 支持 Harbor TLS

.aggregate_docker_build_harbor:
  stage: build
  image: $DOCKER_IMAGE
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    # DinD service 由 runner 统一注入(config.toml [[runners.kubernetes.services]]),此处不得再声明 services:
    # 重复声明会让同一 pod 出现两个 dockerd 抢 :2375。Harbor CA 由 runner 卷挂载到 /etc/docker/certs.d,
    # 而 docker:24 的 BuildKit 不读该目录/系统信任库,故必须使用 classic builder。
    DOCKER_BUILDKIT: "0"
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  before_script:
    - |
      echo "========================================="
      echo "聚合项目 Docker 构建 (Harbor 模式) - $APP_NAME"
      echo "时间: $(date +'%Y-%m-%d %H:%M:%S')"
      echo "========================================="
      # 计算镜像标签
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG=$CI_COMMIT_TAG
      else
        IMAGE_TAG="${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
      fi
      export IMAGE_TAG
      CI_REGISTRY_FULL_IMAGE="$CI_REGISTRY/$CI_REGISTRY_IMAGE/$APP_NAME:$IMAGE_TAG"
      echo "镜像地址: $CI_REGISTRY_FULL_IMAGE"
      docker version
  script:
    - |
      CI_REGISTRY_FULL_IMAGE="$CI_REGISTRY/$CI_REGISTRY_IMAGE/$APP_NAME:$IMAGE_TAG"
      # 构建镜像
        DOCKERFILE_PATH_CALC="$APP_MAVEN_PATH/${DOCKERFILE_PATH}"
      [ -f "$DOCKERFILE_PATH_CALC" ] || DOCKERFILE_PATH_CALC="Dockerfile"
      echo "Dockerfile: $DOCKERFILE_PATH_CALC"
      docker build \
        --force-rm \
        --build-arg BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
        --build-arg VCS_REF=$CI_COMMIT_SHA \
        --build-arg VERSION=$IMAGE_TAG \
        -f "$DOCKERFILE_PATH_CALC" \
        -t "$CI_REGISTRY_FULL_IMAGE" \
        $APP_MAVEN_PATH
      # 推送镜像
      PUSH_SUCCESS=false
      for i in 1 2 3; do
        echo "推送尝试 $i/3..."
        if docker push "$CI_REGISTRY_FULL_IMAGE"; then
          PUSH_SUCCESS=true
          break
        else
          SLEEP=$((2 ** i))
          echo "推送失败,${SLEEP}秒后重试..."
          sleep $SLEEP
        fi
      done
      if [ "$PUSH_SUCCESS" = true ]; then
        echo "推送成功: $CI_REGISTRY_FULL_IMAGE"
      else
        exit 1
      fi
  needs: ["package"]

.aggregate_docker_build_all_harbor:
  stage: build
  image: $DOCKER_IMAGE
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    # DinD service 由 runner 统一注入(config.toml [[runners.kubernetes.services]]),此处不得再声明 services:
    # 重复声明会让同一 pod 出现两个 dockerd 抢 :2375。Harbor CA 由 runner 卷挂载到 /etc/docker/certs.d,
    # 而 docker:24 的 BuildKit 不读该目录/系统信任库,故必须使用 classic builder。
    DOCKER_BUILDKIT: "0"
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  before_script:
    - |
      echo "========================================="
      echo "聚合项目 Docker 全部构建(线性) - Harbor 模式"
      echo "App 列表: $DEPLOYABLE_APPS"
      echo "时间: $(date +'%Y-%m-%d %H:%M:%S')"
      echo "========================================="
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG=$CI_COMMIT_TAG
      else
        IMAGE_TAG="${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
      fi
      export IMAGE_TAG
  script:
    - |
      echo "逐个构建所有应用的 Docker 镜像..."
      failed_apps=""
      for app_path in $DEPLOYABLE_APPS; do
        app_name=$(basename "$app_path")
        app_name_lower=$(echo "$app_name" | tr '[:upper:]' '[:lower:]')
        echo ""
        echo "========================================="
        echo "构建镜像: $app_name ($app_path)"
        echo "========================================="
        CI_REGISTRY_FULL_IMAGE="$CI_REGISTRY/$CI_REGISTRY_IMAGE/$app_name_lower:$IMAGE_TAG"
        echo "镜像地址: $CI_REGISTRY_FULL_IMAGE"
        DOCKERFILE_PATH_CALC="$app_path/${DOCKERFILE_PATH}"
        [ -f "$DOCKERFILE_PATH_CALC" ] || DOCKERFILE_PATH_CALC="Dockerfile"
        echo "Dockerfile: $DOCKERFILE_PATH_CALC"
        if docker build \
          --force-rm \
          --build-arg BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
          --build-arg VCS_REF=$CI_COMMIT_SHA \
          --build-arg VERSION=$IMAGE_TAG \
          -f "$DOCKERFILE_PATH_CALC" \
          -t "$CI_REGISTRY_FULL_IMAGE" \
          $app_path; then
          echo "构建成功: $app_name"
        else
          echo "构建失败: $app_name"
          failed_apps="$failed_apps $app_name"
          continue
        fi
        # 推送镜像
        echo "推送镜像: $CI_REGISTRY_FULL_IMAGE"
        PUSH_SUCCESS=false
        for i in 1 2 3; do
          if docker push "$CI_REGISTRY_FULL_IMAGE"; then
            PUSH_SUCCESS=true
            break
          else
            SLEEP=$((2 ** i))
            echo "推送失败,${SLEEP}秒后重试..."
            sleep $SLEEP
          fi
        done
        if [ "$PUSH_SUCCESS" = true ]; then
          echo "推送成功: $app_name"
        else
          echo "推送失败: $app_name"
          failed_apps="$failed_apps $app_name"
        fi
      done
      echo ""
      echo "========================================="
      echo "构建汇总"
      echo "========================================="
      if [ -n "$failed_apps" ]; then
        echo "失败的应用:$failed_apps"
        exit 1
      else
        echo "全部构建完成!"
      fi
  needs: ["package"]
