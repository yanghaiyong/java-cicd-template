# ============================================
# Trivy 镜像安全扫描
# ============================================

.trivy_scan:
  stage: scan
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  before_script:
    - |
      echo "========================================="
      echo "Trivy 安全扫描开始 - $(date +'%Y-%m-%d %H:%M:%S')"
      echo "========================================="
  script:
    - |
      echo "========================================="
      echo "开始扫描镜像"
      echo "========================================="
      
      # 确定镜像标签
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG=$CI_COMMIT_TAG
      else
        IMAGE_TAG="${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
      fi
      CI_REGISTRY_FULL_IMAGE="$CI_REGISTRY/$CI_REGISTRY_IMAGE:$IMAGE_TAG"
      echo "扫描镜像: $CI_REGISTRY_FULL_IMAGE"
      
      # 运行 Trivy 扫描（宽松模式：仅报告不阻断）
      docker run --rm aquasec/trivy:latest \
        image \
        --severity CRITICAL,HIGH \
        --no-progress \
        --exit-code 0 \
        $CI_REGISTRY_FULL_IMAGE
      
      echo "========================================="
      echo "扫描完成"
      echo "========================================="
  after_script:
    - |
      echo "========================================="
      echo "Trivy 扫描完成 - $(date +'%Y-%m-%d %H:%M:%S')"
      echo "========================================="
  needs: ["build"]
