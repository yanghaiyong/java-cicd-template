# ============================================
# 聚合项目 (Maven Multi-Module) 专用 Job 模板
# ============================================
# 适用场景: 聚合项目,包含多个可部署应用/微服务
# 设计原则: 复用 common_java 的所有设计 (DOCKER_AUTH_CONFIG / sed 变量替换 / 多环境分支策略)
#
# 使用方式:
#   1. include templates/java-pipeline-aggregate.yaml
#   2. 定义 APPS_MATRIX (YAML 列表)
#   3. 准备 <APP_MAVEN_PATH>/src/main/k8s/<env>/deploy.yaml
# =============================================================================

# ---------------------------------------------------------------
# Maven 构建 (聚合项目 - 每个 app 单独,带 -am 依赖)
# ---------------------------------------------------------------
.aggregate_mvn_package:
  stage: package
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  before_script:
    - |
      echo "========================================="
      echo "聚合项目 Maven 构建 - $APP_NAME"
      echo "Maven 模块路径: $APP_MAVEN_PATH"
      echo "时间: $(date +'%Y-%m-%d %H:%M:%S')"
      echo "========================================="
      java -version 2>&1 | head -1
      mvn --version 2>&1 | head -1
      mkdir -p .m2/repository
      echo "工作目录: $(pwd)"
  script:
    - |
      echo "构建模块: $APP_MAVEN_PATH"
      mvn clean package -B -DskipTests \
        -Dmaven.repo.local=.m2/repository \
        -Dmaven.javadoc.skip=true \
        -pl "$APP_MAVEN_PATH" -am \
        -f pom.xml \
        ${MAVEN_SETTINGS:+-s settings.xml}
  after_script:
    - |
      echo "构建产物:"
      ls -lh $APP_MAVEN_PATH/target/*.jar 2>/dev/null || echo "未找到 JAR"
  artifacts:
    name: "$APP_NAME-$CI_COMMIT_REF_NAME"
    when: on_success
    expire_in: 30 days
    paths:
      - $APP_MAVEN_PATH/target/*.jar
  cache:
    policy: pull-push
    key: "maven-aggregate-$CI_COMMIT_REF_SLUG"
    paths:
      - .m2/repository
      - $APP_MAVEN_PATH/target/

# ---------------------------------------------------------------
# 单元测试 (聚合项目 - 每个 app 单独)
# ---------------------------------------------------------------
.aggregate_test:
  stage: test
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  before_script:
    - |
      echo "========================================="
      echo "聚合项目测试 - $APP_NAME"
      echo "========================================="
      mkdir -p .m2/repository
  script:
    - |
      mvn test jacoco:report -B \
        -Dmaven.repo.local=.m2/repository \
        -pl "$APP_MAVEN_PATH" -am \
        -f pom.xml \
        ${MAVEN_SETTINGS:+-s settings.xml}
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: $APP_MAVEN_PATH/target/surefire-reports/TEST-*.xml
      coverage_report:
        coverage_format: jacoco
        path: $APP_MAVEN_PATH/target/site/jacoco/jacoco.xml
    paths:
      - $APP_MAVEN_PATH/target/surefire-reports/
      - $APP_MAVEN_PATH/target/site/jacoco/
  cache:
    policy: pull-push
    key: "maven-aggregate-$CI_COMMIT_REF_SLUG"
    paths:
      - .m2/repository

# ---------------------------------------------------------------
# Docker 镜像构建 (聚合项目 - 复用 DOCKER_AUTH_CONFIG 风格)
# ---------------------------------------------------------------
.aggregate_docker_build:
  stage: build
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  before_script:
    - |
      echo "========================================="
      echo "聚合项目 Docker 构建 - $APP_NAME"
      echo "Maven 模块: $APP_MAVEN_PATH"
      echo "========================================="
      docker version
      # 计算镜像标签 (与 common_java 一致: branch-sha, tag 用 v*)
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG=$CI_COMMIT_TAG
        echo "正式发布 - 使用 Tag: $IMAGE_TAG"
      else
        IMAGE_TAG="${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
        echo "非生产环境 - 使用分支标签: $IMAGE_TAG"
      fi
      # 镜像名: $CI_REGISTRY/<project>/$APP_NAME:$TAG
      CI_REGISTRY_IMAGE_FULL="$CI_REGISTRY_IMAGE/$APP_NAME"
      CI_REGISTRY_FULL_IMAGE="$CI_REGISTRY/$CI_REGISTRY_IMAGE_FULL:$IMAGE_TAG"
      echo "镜像地址: $CI_REGISTRY_FULL_IMAGE"
      # DOCKER_AUTH_CONFIG 由 GitLab CI 自动注入 ~/.docker/config.json
      if [ -z "$DOCKER_AUTH_CONFIG" ]; then
        echo "警告: 未配置 DOCKER_AUTH_CONFIG，docker push 可能失败"
      fi
  script:
    - |
      # 计算镜像路径 (in-script 与 before_script 共享)
      CI_REGISTRY_IMAGE_FULL="$CI_REGISTRY_IMAGE/$APP_NAME"
      CI_REGISTRY_FULL_IMAGE="$CI_REGISTRY/$CI_REGISTRY_IMAGE_FULL:$IMAGE_TAG"

      # 构建镜像
      DOCKERFILE_PATH_CALC="$APP_MAVEN_PATH/src/main/docker/Dockerfile"
      [ -f "$DOCKERFILE_PATH_CALC" ] || DOCKERFILE_PATH_CALC="Dockerfile"
      echo "Dockerfile: $DOCKERFILE_PATH_CALC"

      docker build \
        --force-rm \
        --build-arg BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
        --build-arg VCS_REF=$CI_COMMIT_SHA \
        --build-arg VERSION=$IMAGE_TAG \
        -f "$DOCKERFILE_PATH_CALC" \
        -t "$CI_REGISTRY_FULL_IMAGE" \
        $APP_MAVEN_PATH

      # 推送镜像 (指数退避重试,与 common_java 一致)
      PUSH_SUCCESS=false
      for i in 1 2 3; do
        echo "推送尝试 $i/3..."
        if docker push "$CI_REGISTRY_FULL_IMAGE"; then
          PUSH_SUCCESS=true
          break
        else
          if [ $i -eq 3 ]; then
            echo "推送失败,已达最大重试次数"
          else
            SLEEP=$((2 ** i))
            echo "推送失败,${SLEEP}秒后重试..."
            sleep $SLEEP
          fi
        fi
      done

      if [ "$PUSH_SUCCESS" = true ]; then
        echo "镜像推送成功: $CI_REGISTRY_FULL_IMAGE"
      else
        exit 1
      fi
  needs: ["package"]

# ---------------------------------------------------------------
# Trivy 镜像扫描 (聚合项目)
# ---------------------------------------------------------------
.aggregate_trivy_scan:
  stage: scan
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  before_script:
    - |
      echo "========================================="
      echo "Trivy 安全扫描 - $APP_NAME"
      echo "========================================="
  script:
    - |
      CI_REGISTRY_IMAGE_FULL="$CI_REGISTRY_IMAGE/$APP_NAME"
      CI_REGISTRY_FULL_IMAGE="$CI_REGISTRY/$CI_REGISTRY_IMAGE_FULL:$IMAGE_TAG"
      echo "扫描镜像: $CI_REGISTRY_FULL_IMAGE"
      # 宽松模式: 仅报告不阻断
      docker run --rm aquasec/trivy:latest \
        image \
        --severity CRITICAL,HIGH \
        --no-progress \
        --exit-code 0 \
        "$CI_REGISTRY_FULL_IMAGE"
  needs: ["build"]

# ---------------------------------------------------------------
# Kubernetes 部署 (聚合项目 - sed 变量替换 + 多环境分支)
# ---------------------------------------------------------------
.aggregate_k8s_deploy:
  stage: deploy
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  # 多环境自动分支识别 (与 common_java/deploy.yaml 一致)
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      variables:
        K8S_ENV: "dev"
        K8S_NAMESPACE: "app-dev"
    - if: '$CI_COMMIT_BRANCH == "test"'
      variables:
        K8S_ENV: "test"
        K8S_NAMESPACE: "app-test"
    - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main"'
      variables:
        K8S_ENV: "pre-prod"
        K8S_NAMESPACE: "app-pre-prod"
    - if: '$CI_COMMIT_TAG'
      variables:
        K8S_ENV: "prod"
        K8S_NAMESPACE: "app-prod"
  before_script:
    - |
      echo "========================================="
      echo "聚合项目 K8s 部署 - $APP_NAME"
      echo "环境: $K8S_ENV | Namespace: $K8S_NAMESPACE"
      echo "========================================="
      # 拼接 K8s YAML 路径: <APP_MAVEN_PATH>/src/main/k8s/<env>/deploy.yaml
      export K8S_YAML="${APP_MAVEN_PATH}/src/main/k8s/${K8S_ENV}/deploy.yaml"
      echo "K8s YAML: $K8S_YAML"
      # Kubeconfig 认证 (context 优先, content 备用)
      if [ -n "$KUBECONFIG_CONTEXT" ]; then
        echo "使用 KUBECONFIG_CONTEXT: $KUBECONFIG_CONTEXT"
        export KUBECONFIG=""
        kubectl config use-context $KUBECONFIG_CONTEXT
      elif [ -n "$KUBECONFIG_CONTENT" ]; then
        echo "$KUBECONFIG_CONTENT" | base64 -d > /tmp/kubeconfig
        chmod 600 /tmp/kubeconfig
        export KUBECONFIG=/tmp/kubeconfig
      else
        echo "错误: KUBECONFIG_CONTEXT 或 KUBECONFIG_CONTENT 未配置"
        exit 1
      fi
      kubectl version --client
  script:
    - |
      export K8S_YAML="${APP_MAVEN_PATH}/src/main/k8s/${K8S_ENV}/deploy.yaml"

      # 镜像标签
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG=$CI_COMMIT_TAG
      else
        IMAGE_TAG="${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
      fi
      CI_REGISTRY_IMAGE_FULL="$CI_REGISTRY_IMAGE/$APP_NAME"
      CI_REGISTRY_FULL_IMAGE="$CI_REGISTRY/$CI_REGISTRY_IMAGE_FULL:$IMAGE_TAG"
      echo "部署镜像: $CI_REGISTRY_FULL_IMAGE"

      # 检查 K8s YAML
      if [ ! -f "$K8S_YAML" ]; then
        echo "错误: K8s YAML 不存在: $K8S_YAML"
        exit 1
      fi

      # sed 替换所有变量 (与 common_java/deploy.yaml 完全一致)
      if [ -z "$DOCKER_CONFIG" ]; then
        sed -i "/^---$/,/^kind: Secret/d" $K8S_YAML
        sed -i "/imagePullSecrets:/d" $K8S_YAML
      else
        sed -i "s|\${IMAGE_PULL_SECRETS}|$IMAGE_PULL_SECRETS|g" $K8S_YAML
        sed -i "s|\${DOCKER_CONFIG}|$DOCKER_CONFIG|g" $K8S_YAML
      fi
      sed -i "s|\${APP_NAME}|$APP_NAME|g" $K8S_YAML
      sed -i "s|\${K8S_NAMESPACE}|$K8S_NAMESPACE|g" $K8S_YAML
      sed -i "s|\${CI_REGISTRY_FULL_IMAGE}|$CI_REGISTRY_FULL_IMAGE|g" $K8S_YAML
      sed -i "s|\${IMAGE_TAG}|$IMAGE_TAG|g" $K8S_YAML
      sed -i "s|\${SERVICE_TYPE}|$SERVICE_TYPE|g" $K8S_YAML
      sed -i "s|\${SERVICE_PORT}|$SERVICE_PORT|g" $K8S_YAML
      sed -i "s|\${CONTAINER_PORT}|$CONTAINER_PORT|g" $K8S_YAML
      sed -i "s|\${IMAGE_PULL_POLICY}|$IMAGE_PULL_POLICY|g" $K8S_YAML
      sed -i "s|\${REPLICAS}|$REPLICAS|g" $K8S_YAML
      sed -i "s|\${MAX_SURGE}|$MAX_SURGE|g" $K8S_YAML
      sed -i "s|\${MAX_UNAVAILABLE}|$MAX_UNAVAILABLE|g" $K8S_YAML
      sed -i "s|\${MEMORY_REQUEST}|$MEMORY_REQUEST|g" $K8S_YAML
      sed -i "s|\${CPU_REQUEST}|$CPU_REQUEST|g" $K8S_YAML
      sed -i "s|\${MEMORY_LIMIT}|$MEMORY_LIMIT|g" $K8S_YAML
      sed -i "s|\${CPU_LIMIT}|$CPU_LIMIT|g" $K8S_YAML
      sed -i "s|\${HEALTH_CHECK_PATH}|$HEALTH_CHECK_PATH|g" $K8S_YAML
      sed -i "s|\${LIVENESS_INITIAL_DELAY}|$LIVENESS_INITIAL_DELAY|g" $K8S_YAML
      sed -i "s|\${READINESS_INITIAL_DELAY}|$READINESS_INITIAL_DELAY|g" $K8S_YAML
      sed -i "s|\${HPA_MIN_REPLICAS}|$HPA_MIN_REPLICAS|g" $K8S_YAML
      sed -i "s|\${HPA_MAX_REPLICAS}|$HPA_MAX_REPLICAS|g" $K8S_YAML
      sed -i "s|\${HPA_CPU_THRESHOLD}|$HPA_CPU_THRESHOLD|g" $K8S_YAML
      sed -i "s|\${HPA_MEMORY_THRESHOLD}|$HPA_MEMORY_THRESHOLD|g" $K8S_YAML
      sed -i "s|\${HPA_SCALE_DOWN_WINDOW}|$HPA_SCALE_DOWN_WINDOW|g" $K8S_YAML
      sed -i "s|\${JAVA_MIN_HEAP}|$JAVA_MIN_HEAP|g" $K8S_YAML
      sed -i "s|\${JAVA_MAX_HEAP}|$JAVA_MAX_HEAP|g" $K8S_YAML

      # dry-run 验证
      echo "验证 YAML 语法..."
      if ! kubectl apply --dry-run=client -f $K8S_YAML -n ${K8S_NAMESPACE} >/dev/null 2>&1; then
        echo "错误: YAML 验证失败"
        kubectl apply --dry-run=client -f $K8S_YAML -n ${K8S_NAMESPACE} 2>&1 || true
        exit 1
      fi

      # 创建 namespace
      if ! kubectl get namespace ${K8S_NAMESPACE} >/dev/null 2>&1; then
        kubectl create namespace ${K8S_NAMESPACE}
      fi

      # 部署
      if kubectl apply -f $K8S_YAML -n ${K8S_NAMESPACE}; then
        echo "部署成功,等待就绪..."
        if kubectl rollout status deployment/${APP_NAME} -n ${K8S_NAMESPACE} --timeout=120s; then
          echo "应用已就绪"
        else
          echo "警告: rollout 超时,请手动检查 Pod 状态"
        fi
      else
        echo "部署失败"
        exit 1
      fi

      echo "部署完成!"
      kubectl get deployments -n ${K8S_NAMESPACE}
      kubectl get pods -n ${K8S_NAMESPACE} -l app=${APP_NAME}
  needs: ["build", "scan"]

# ---------------------------------------------------------------
# 全项目编译验证 (聚合项目入口)
# ---------------------------------------------------------------
.aggregate_maven_compile:
  stage: package
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  before_script:
    - mkdir -p .m2/repository
  script:
    - |
      echo "全项目编译验证"
      mvn -B -ntp -T 1C compile \
        -DskipTests \
        -Dcheckstyle.skip=true \
        -Dmaven.javadoc.skip=true \
        -Dmaven.repo.local=.m2/repository \
        -f pom.xml \
        ${MAVEN_SETTINGS:+-s settings.xml}
  cache:
    policy: pull-push
    key: "maven-aggregate-$CI_COMMIT_REF_SLUG"
    paths:
      - .m2/repository
