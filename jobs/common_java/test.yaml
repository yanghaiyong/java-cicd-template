# ============================================
# Java Maven 测试 - JaCoCo 覆盖率
# ============================================

.test:
  stage: test
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  before_script:
    - |
      echo "========================================="
      echo "测试开始 - $(date +'%Y-%m-%d %H:%M:%S')"
      echo "========================================="
      echo "测试命令: $TEST_SHELL"
      echo "测试报告路径: $JUNIT_REPORT_PATH"
      java -version 2>&1 | head -1
      mvn -version 2>&1 | head -1
      # ==========================================
      # Nexus3 Maven 仓库集成（与 package.yaml 保持一致）
      # 如果配置了 NEXUS_MAVEN_URL，则动态生成 settings.xml 走 Nexus3
      # 未配置时保留项目自带 settings.xml（原逻辑）
      # 如需回退，删除以下 NEXUS 相关代码块即可
      # ==========================================
      if [ -n "$NEXUS_MAVEN_URL" ]; then
        echo "检测到 Nexus3 配置，生成 Maven settings.xml..."
        cat > settings.xml << NEXUSEOF
<?xml version="1.0" encoding="UTF-8"?>
<settings xmlns="http://maven.apache.org/SETTINGS/1.2.0"
          xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
          xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.2.0 https://maven.apache.org/xsd/settings-1.2.0.xsd">
  <servers>
    <server>
      <id>nexus-central</id>
      <username>${NEXUS_USERNAME}</username>
      <password>${NEXUS_PASSWORD}</password>
    </server>
    <server>
      <id>nexus-releases</id>
      <username>${NEXUS_USERNAME}</username>
      <password>${NEXUS_PASSWORD}</password>
    </server>
    <server>
      <id>nexus-snapshots</id>
      <username>${NEXUS_USERNAME}</username>
      <password>${NEXUS_PASSWORD}</password>
    </server>
  </servers>
  <mirrors>
    <mirror>
      <id>nexus-central</id>
      <mirrorOf>*</mirrorOf>
      <name>Nexus3 Maven Public</name>
      <url>${NEXUS_MAVEN_URL}</url>
    </mirror>
  </mirrors>
</settings>
NEXUSEOF
        echo "settings.xml 已生成，Nexus3: $NEXUS_MAVEN_URL"
      else
        # 原逻辑：使用项目自带的 settings.xml
        if [ ! -f settings.xml ]; then
          echo "警告: 项目无 settings.xml 且未配置 Nexus3，使用 Maven 默认配置"
        else
          echo "使用项目自带 settings.xml"
        fi
      fi
      echo "========================================="
  script:
    - |
      echo "========================================="
      echo "开始执行测试"
      echo "========================================="
      $TEST_SHELL
      TEST_RESULT=$?
      echo "========================================="
      if [ $TEST_RESULT -eq 0 ]; then
        echo "测试通过 ✓"
      else
        echo "测试失败 ✗"
        echo "========================================="
        exit 1
      fi
  after_script:
    - |
      echo "========================================="
      echo "测试完成 - $(date +'%Y-%m-%d %H:%M:%S')"
      echo "========================================="
      echo "测试报告文件:"
      if [ -d "$JUNIT_REPORT_PATH" ]; then
        ls -la $JUNIT_REPORT_PATH || echo "报告目录为空"
      else
        echo "报告目录不存在: $JUNIT_REPORT_PATH"
      fi
      echo "========================================="
  artifacts:
    reports:
      junit: ${JUNIT_REPORT_PATH}TEST-*.xml
      coverage_report:
        coverage_format: jacoco
        path: ${JACOCO_REPORT_PATH}
    when: always
    expire_in: 7 days
    paths:
      - ${JUNIT_REPORT_PATH}
    expose_as: "Test Report"
  cache:
    policy: pull-push
    key: "maven-${CI_COMMIT_REF_SLUG}"
    paths:
      - .m2/repository
