# =============================================================================
# 聚合项目 (Maven Multi-Module / Microservices) CI/CD Job 模板
# =============================================================================
# 版本: 1.0
# 用途: 适用于聚合项目,包含多个可部署应用/微服务
#
# 核心特性:
#   - parallel:matrix 并行构建多个应用 (8+ 并发)
#   - rules:changes 增量触发 (基础库变更自动触发依赖应用)
#   - 与单体模板相同的部署风格 (kubectl set image)
#
# 使用方式:
#   1. 在项目仓库 .gitlab-ci.yml 中 include templates/java-pipeline-aggregate.yaml
#   2. 定义 APPS_MATRIX 变量 (YAML 列表,每个 app 一个条目)
#   3. 定义 BASE_LIB_PATHS 变量 (基础库路径,触发依赖应用重建)
#   4. 准备 k8s/<app-name>.yaml 部署文件
# =============================================================================

# ---------------------------------------------------------------
# Maven 构建 (聚合项目专用) - 每个 app 单独构建,带依赖
# ---------------------------------------------------------------
.aggregate_mvn_build:
  image: $MAVEN_IMAGE
  stage: package
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  variables:
    GIT_CHECKOUT: "true"
  before_script:
    - |
      echo "========================================="
      echo "聚合项目 Maven 构建 - $APP_NAME"
      echo "Maven 路径: $APP_MAVEN_PATH"
      echo "时间: $(date +'%Y-%m-%d %H:%M:%S')"
      echo "========================================="
      java -version 2>&1 | head -1
      mvn --version 2>&1 | head -1
      mkdir -p .m2/repository
  script:
    - |
      echo "构建模块: $APP_MAVEN_PATH"
      mvn clean package -B -DskipTests \
        -Dmaven.repo.local=.m2/repository \
        -Dmaven.javadoc.skip=true \
        -pl "$APP_MAVEN_PATH" -am \
        -f pom.xml \
        ${MAVEN_SETTINGS:+-s settings.xml}
  after_script:
    - |
      echo "构建产物:"
      ls -lh $APP_MAVEN_PATH/target/*.jar 2>/dev/null || echo "未找到 JAR"
  artifacts:
    name: "$APP_NAME-$CI_COMMIT_REF_NAME"
    when: on_success
    expire_in: 30 days
    paths:
      - $APP_MAVEN_PATH/target/*.jar
  cache:
    policy: pull-push
    key: "maven-aggregate-$CI_COMMIT_REF_SLUG"
    paths:
      - .m2/repository

# ---------------------------------------------------------------
# 单元测试 (聚合项目专用)
# ---------------------------------------------------------------
.aggregate_test:
  image: $MAVEN_IMAGE
  stage: test
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  variables:
    GIT_CHECKOUT: "true"
  before_script:
    - |
      echo "========================================="
      echo "聚合项目测试 - $APP_NAME"
      echo "========================================="
      mkdir -p .m2/repository
  script:
    - |
      mvn test -B \
        -Dmaven.repo.local=.m2/repository \
        -pl "$APP_MAVEN_PATH" -am \
        -f pom.xml \
        ${MAVEN_SETTINGS:+-s settings.xml}
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: $APP_MAVEN_PATH/target/surefire-reports/TEST-*.xml
      coverage_report:
        coverage_format: jacoco
        path: $APP_MAVEN_PATH/target/site/jacoco/jacoco.xml
    paths:
      - $APP_MAVEN_PATH/target/surefire-reports/
      - $APP_MAVEN_PATH/target/site/jacoco/
  cache:
    policy: pull-push
    key: "maven-aggregate-$CI_COMMIT_REF_SLUG"
    paths:
      - .m2/repository

# ---------------------------------------------------------------
# Docker 镜像构建 (聚合项目专用) - 推送 Harbor
# ---------------------------------------------------------------
.aggregate_docker_build:
  image: $DOCKER_IMAGE
  stage: build
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  variables:
    GIT_CHECKOUT: "true"
    DOCKERFILE_PATH: "$APP_MAVEN_PATH/src/main/docker/Dockerfile"
    # 镜像名: $CI_REGISTRY/$CI_REGISTRY_IMAGE/$APP_NAME:$TAG
    CI_REGISTRY_IMAGE_BASE: $CI_REGISTRY_IMAGE
  before_script:
    - |
      echo "========================================="
      echo "聚合项目 Docker 构建 - $APP_NAME"
      echo "Maven 模块: $APP_MAVEN_PATH"
      echo "========================================="
      docker version
      # 计算镜像名
      CI_REGISTRY_IMAGE="$CI_REGISTRY_IMAGE_BASE/$APP_NAME"
      CI_REGISTRY_FULL_IMAGE="$CI_REGISTRY/$CI_REGISTRY_IMAGE:$IMAGE_TAG"
      echo "完整镜像: $CI_REGISTRY_FULL_IMAGE"
      # Docker 登录
      for i in 1 2 3; do
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY && break || {
          [ $i -eq 3 ] && { echo "Docker 登录失败"; exit 1; }
          echo "登录失败,2秒后重试..."
          sleep 2
        }
      done
  script:
    - |
      # 确定镜像标签策略 (与单体一致)
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG=$CI_COMMIT_TAG
      elif [ "$CI_COMMIT_BRANCH" = "master" ] || [ "$CI_COMMIT_BRANCH" = "main" ]; then
        IMAGE_TAG="latest"
      else
        IMAGE_TAG=$CI_COMMIT_SHORT_SHA
      fi
      CI_REGISTRY_IMAGE="$CI_REGISTRY_IMAGE_BASE/$APP_NAME"
      CI_REGISTRY_FULL_IMAGE="$CI_REGISTRY/$CI_REGISTRY_IMAGE:$IMAGE_TAG"
      echo "镜像 TAG: $IMAGE_TAG"
      echo "镜像地址: $CI_REGISTRY_FULL_IMAGE"
      
      # 构建镜像
      docker build \
        --force-rm \
        --build-arg BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
        --build-arg VCS_REF=$CI_COMMIT_SHA \
        --build-arg VERSION=$IMAGE_TAG \
        -f $DOCKERFILE_PATH \
        -t $CI_REGISTRY_FULL_IMAGE \
        $APP_MAVEN_PATH
      echo "镜像构建成功"
      
      # 推送镜像 (带重试)
      PUSH_SUCCESS=false
      for i in 1 2 3; do
        if docker push $CI_REGISTRY_FULL_IMAGE; then
          PUSH_SUCCESS=true
          break
        else
          [ $i -eq 3 ] && echo "推送失败,已达最大重试次数" || { echo "推送失败,2秒后重试..."; sleep 2; }
        fi
      done
      
      if [ "$PUSH_SUCCESS" = true ]; then
        echo "镜像推送成功: $CI_REGISTRY_FULL_IMAGE"
      else
        echo "镜像推送失败"
        exit 1
      fi
  after_script:
    - |
      docker logout $CI_REGISTRY || true
      docker system prune -af || true
  cache:
    policy: push

# ---------------------------------------------------------------
# Kubernetes 部署 (聚合项目专用) - kubectl set image
# ---------------------------------------------------------------
.aggregate_k8s_deploy:
  image:
    name: $KUBECTL_IMAGE
    entrypoint: [ "" ]
  stage: deploy
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  variables:
    GIT_CHECKOUT: "true"
    KUBECONFIG: /tmp/kubeconfig
  before_script:
    - |
      echo "========================================="
      echo "聚合项目 K8s 部署 - $APP_NAME"
      echo "Namespace: $K8S_NAMESPACE"
      echo "========================================="
      # Kubeconfig
      if [ -n "$KUBECONFIG_CONTENT" ]; then
        echo "$KUBECONFIG_CONTENT" > ${KUBECONFIG}
        chmod 600 ${KUBECONFIG}
      elif [ -n "$KUBECTL_CONFIG_PATH" ]; then
        # GitLab Agent 或 in-cluster 模式
        echo "使用 GitLab Agent 或 in-cluster 模式"
      else
        echo "错误: 未配置 KUBECONFIG_CONTENT 或 KUBECTL_CONFIG_PATH"
        exit 1
      fi
      kubectl version --client
  script:
    - |
      # 镜像标签 (与 build 一致)
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG=$CI_COMMIT_TAG
      elif [ "$CI_COMMIT_BRANCH" = "master" ] || [ "$CI_COMMIT_BRANCH" = "main" ]; then
        IMAGE_TAG="latest"
      else
        IMAGE_TAG=$CI_COMMIT_SHORT_SHA
      fi
      CI_REGISTRY_IMAGE="$CI_REGISTRY_IMAGE_BASE/$APP_NAME"
      CI_REGISTRY_FULL_IMAGE="$CI_REGISTRY/$CI_REGISTRY_IMAGE:$IMAGE_TAG"
      
      # 检查 namespace
      if ! kubectl get namespace ${K8S_NAMESPACE} >/dev/null 2>&1; then
        echo "创建 namespace: ${K8S_NAMESPACE}"
        kubectl create namespace ${K8S_NAMESPACE}
      fi
      
      # 检查 K8s YAML 是否存在 (聚合项目每个 app 独立 yaml)
      K8S_YAML_PATH="k8s/${APP_NAME}.yaml"
      if [ -f "$K8S_YAML_PATH" ]; then
        echo "发现部署文件: $K8S_YAML_PATH"
        kubectl apply -f "$K8S_YAML_PATH" -n ${K8S_NAMESPACE}
        # 使用 kubectl set image 更新镜像
        kubectl set image deployment/${APP_NAME} \
          ${APP_NAME}=${CI_REGISTRY_FULL_IMAGE} \
          agent-container=${SKYWALKING_AGENT_IMAGE} \
          -n ${K8S_NAMESPACE} || echo "跳过 set image (Deployment 不存在)"
      else
        echo "未发现部署文件: $K8S_YAML_PATH, 仅使用 kubectl set image"
        kubectl set image deployment/${APP_NAME} \
          ${APP_NAME}=${CI_REGISTRY_FULL_IMAGE} \
          agent-container=${SKYWALKING_AGENT_IMAGE} \
          -n ${K8S_NAMESPACE}
      fi
      
      # 等待 rollout
      if kubectl rollout status deployment/${APP_NAME} -n ${K8S_NAMESPACE} --timeout=300s; then
        echo "✓ 部署成功: $APP_NAME"
      else
        echo "✗ 部署失败: $APP_NAME"
        kubectl describe deployment/${APP_NAME} -n ${K8S_NAMESPACE} || true
        exit 1
      fi
      
      # 验证
      kubectl get pods -n ${K8S_NAMESPACE} -l app=${APP_NAME}
  cache:
    policy: push

# ---------------------------------------------------------------
# 验证阶段: 全项目 Maven 编译 (聚合项目)
# ---------------------------------------------------------------
.aggregate_maven_compile:
  image: $MAVEN_IMAGE
  stage: validate
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  variables:
    GIT_CHECKOUT: "true"
  before_script:
    - mkdir -p .m2/repository
  script:
    - |
      echo "全项目编译验证 (所有 module)"
      mvn -B -ntp -T 1C compile \
        -DskipTests \
        -Dcheckstyle.skip=true \
        -Dmaven.javadoc.skip=true \
        -Dmaven.repo.local=.m2/repository \
        -f pom.xml \
        ${MAVEN_SETTINGS:+-s settings.xml}
  cache:
    policy: pull-push
    key: "maven-aggregate-$CI_COMMIT_REF_SLUG"
    paths:
      - .m2/repository
