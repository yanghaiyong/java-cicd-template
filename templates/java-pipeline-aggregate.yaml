# =============================================================================
# Java 聚合项目 CI/CD 流水线模板 (java-pipeline-aggregate.yaml)
# =============================================================================
# 适用场景:
#   - Maven 多模块聚合项目 (SpringBootStarry 类)
#   - 多个可部署应用/微服务 (8+ 个)
#   - 需要增量构建 (基础库变更自动触发依赖应用)
#
# 使用方式 (SpringBootLearning 为例):
#   .gitlab-ci.yml:
#     include:
#       - project: 'cidevops/java-cicd-template'
#         ref: master
#         file: 'templates/java-pipeline-aggregate.yaml'
#     
#     variables:
#       APPS_MATRIX: |
#         - {name: "starry-gateway",    maven_path: "SpringBootStarry/StarryGateway"}
#         - {name: "starry-datacenter", maven_path: "SpringBootStarry/StarryDataCenter"}
#         ...
#       BASE_LIB_PATHS: |
#         - SpringBootStarry/StarryCommon/**
#         - SpringBootStarry/StarryConfig/**
#         - SpringBootStarry/StarryStarter/**
#         - SpringBootStarry/pom.xml
#         - pom.xml
#       CI_REGISTRY: harbor-ui.master.com
#       CI_REGISTRY_IMAGE: springboot
#       K8S_NAMESPACE: app-pre-prod
#
# 流水线架构:
#   validate (编译验证) → matrix.test (8 并行) → matrix.build (8 并行) → matrix.deploy (8 并行)
# =============================================================================

include:
  - project: 'cidevops/java-cicd-template'
    ref: master
    file: 'jobs/aggregate.yaml'

stages:
  - validate
  - test
  - build
  - deploy

variables:
  # ============================================
  # 镜像变量 (与单体模板一致)
  # ============================================
  MAVEN_IMAGE: "maven:3.9.6-eclipse-temurin-17"
  DOCKER_IMAGE: "docker:24.0.7-dind"
  KUBECTL_IMAGE: "bitnami/kubectl:1.30"
  SKYWALKING_AGENT_IMAGE: "apache/skywalking-java-agent:9.6.0-java17"

  # ============================================
  # 默认值 (使用方需覆盖)
  # ============================================
  CI_REGISTRY: "k8s-node-1:5000"
  CI_REGISTRY_IMAGE: ""          # 镜像项目,如 springboot
  K8S_NAMESPACE: "default"
  CI_REGISTRY_USER: "admin"
  CI_REGISTRY_PASSWORD: "admin"

# =============================================================================
# 阶段 1: 全项目编译验证 (validate)
# =============================================================================
aggregate:compile:
  extends: .aggregate_maven_compile
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# =============================================================================
# 阶段 2: 单元测试 (test) - parallel:matrix 8 并行
# =============================================================================
aggregate:test:
  extends: .aggregate_test
  parallel: 8
  matrix:
    - APP_NAME: "starry-gateway"
      APP_MAVEN_PATH: "SpringBootStarry/StarryGateway"
    - APP_NAME: "starry-datacenter"
      APP_MAVEN_PATH: "SpringBootStarry/StarryDataCenter"
    - APP_NAME: "starry-admin"
      APP_MAVEN_PATH: "SpringBootStarry/StarryAdmin"
    - APP_NAME: "starry-api"
      APP_MAVEN_PATH: "SpringBootStarry/StarryApi"
    - APP_NAME: "starry-auth"
      APP_MAVEN_PATH: "SpringBootStarry/StarryAuth"
    - APP_NAME: "starry-oauth-server"
      APP_MAVEN_PATH: "SpringBootStarry/StarryOauthServer"
    - APP_NAME: "starry-oauth-resource"
      APP_MAVEN_PATH: "SpringBootStarry/StarryOauthResource"
    - APP_NAME: "starry-sentinel"
      APP_MAVEN_PATH: "SpringBootStarry/StarrySentinel"
  needs: ["aggregate:compile"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# =============================================================================
# 阶段 3: Docker 镜像构建 (build) - parallel:matrix 8 并行
# 增量触发: 基础库变更触发所有 app,单独 app 变更只触发该 app
# =============================================================================
aggregate:build:
  extends: .aggregate_docker_build
  parallel: 8
  matrix:
    - APP_NAME: "starry-gateway"
      APP_MAVEN_PATH: "SpringBootStarry/StarryGateway"
    - APP_NAME: "starry-datacenter"
      APP_MAVEN_PATH: "SpringBootStarry/StarryDataCenter"
    - APP_NAME: "starry-admin"
      APP_MAVEN_PATH: "SpringBootStarry/StarryAdmin"
    - APP_NAME: "starry-api"
      APP_MAVEN_PATH: "SpringBootStarry/StarryApi"
    - APP_NAME: "starry-auth"
      APP_MAVEN_PATH: "SpringBootStarry/StarryAuth"
    - APP_NAME: "starry-oauth-server"
      APP_MAVEN_PATH: "SpringBootStarry/StarryOauthServer"
    - APP_NAME: "starry-oauth-resource"
      APP_MAVEN_PATH: "SpringBootStarry/StarryOauthResource"
    - APP_NAME: "starry-sentinel"
      APP_MAVEN_PATH: "SpringBootStarry/StarrySentinel"
  needs:
    - aggregate:compile
    - job: "aggregate:test"
      optional: true
  # 增量触发: 基础库 OR 本 app 源码变更
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_TAG'
      changes:
        # 基础库变更触发所有 app
        - SpringBootStarry/StarryCommon/**/*
        - SpringBootStarry/StarryConfig/**/*
        - SpringBootStarry/StarryStarter/**/*
        - SpringBootStarry/pom.xml
        - pom.xml
        # 本 app 源码变更
        - "${APP_MAVEN_PATH}/**/*"
        - "${APP_MAVEN_PATH}/pom.xml"

# =============================================================================
# 阶段 4: Kubernetes 部署 (deploy) - parallel:matrix 8 并行
# =============================================================================
aggregate:deploy:
  extends: .aggregate_k8s_deploy
  parallel: 8
  matrix:
    - APP_NAME: "starry-gateway"
      APP_MAVEN_PATH: "SpringBootStarry/StarryGateway"
    - APP_NAME: "starry-datacenter"
      APP_MAVEN_PATH: "SpringBootStarry/StarryDataCenter"
    - APP_NAME: "starry-admin"
      APP_MAVEN_PATH: "SpringBootStarry/StarryAdmin"
    - APP_NAME: "starry-api"
      APP_MAVEN_PATH: "SpringBootStarry/StarryApi"
    - APP_NAME: "starry-auth"
      APP_MAVEN_PATH: "SpringBootStarry/StarryAuth"
    - APP_NAME: "starry-oauth-server"
      APP_MAVEN_PATH: "SpringBootStarry/StarryOauthServer"
    - APP_NAME: "starry-oauth-resource"
      APP_MAVEN_PATH: "SpringBootStarry/StarryOauthResource"
    - APP_NAME: "starry-sentinel"
      APP_MAVEN_PATH: "SpringBootStarry/StarrySentinel"
  needs:
    - job: "aggregate:build"
      optional: true
  rules:
    # tag 触发自动部署
    - if: '$CI_COMMIT_TAG'
    # main 分支手动部署
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
      when: manual
      allow_failure: true
