# ============================================
# 通用 Java 聚合项目 CI/CD 流水线模板 (v1.0)
# ============================================
# 适用场景: Maven 多模块聚合项目 (SpringBootStarry 类)
#
# 设计原则: 100% 复用 common_java 的所有设计
#   - DOCKER_AUTH_CONFIG (而非 docker login)
#   - sed 变量替换 ${VAR}
#   - 多环境分支策略 (develop→dev / test→test / master→pre-prod / tag→prod)
#   - 镜像 TAG: tag 用 v*, 其他用 branch-sha
#   - 镜像仓库: 默认 k8s-node-1:5000 (集群本地 registry)
#
# 使用方式:
#   .gitlab-ci.yml:
#     include:
#       - project: 'cidevops/java-cicd-template'
#         ref: master
#         file: 'templates/java-pipeline-aggregate.yaml'
#
#     variables:
#       CI_REGISTRY: harbor-ui.master.com        # 覆盖默认 k8s-node-1:5000
#       CI_REGISTRY_IMAGE: springboot
#       KUBECONFIG_CONTEXT: my-cluster-context   # 或 KUBECONFIG_CONTENT
#
# 文件组织约定 (与 common_java 一致):
#   <APP_MAVEN_PATH>/src/main/k8s/<env>/deploy.yaml
#   例: SpringBootStarry/StarryGateway/src/main/k8s/pre-prod/deploy.yaml
# =============================================================================

include:
  - project: 'cidevops/java-cicd-template'
    ref: master
    file: 'jobs/common_aggregate/package.yaml'
  - project: 'cidevops/java-cicd-template'
    ref: master
    file: 'jobs/common_aggregate/test.yaml'
  - project: 'cidevops/java-cicd-template'
    ref: master
    file: 'jobs/common_aggregate/build.yaml'
  - project: 'cidevops/java-cicd-template'
    ref: master
    file: 'jobs/common_aggregate/scan.yaml'
  - project: 'cidevops/java-cicd-template'
    ref: master
    file: 'jobs/common_aggregate/deploy.yaml'

stages:
  - package
  - test
  - build
  - scan
  - deploy

variables:
  # ============================================
  # 镜像变量 (与 common_java 一致)
  # ============================================
  MAVEN_IMAGE: "maven:3.9.6-eclipse-temurin-17"
  DOCKER_IMAGE: "docker:24.0.7-dind"
  KUBECTL_IMAGE: "bitnami/kubectl:1.30"
  SKYWALKING_AGENT_IMAGE: "apache/skywalking-java-agent:9.6.0-java17"

  # ============================================
  # 镜像仓库 (默认集群本地 registry,可覆盖)
  # ============================================
  CI_REGISTRY: "k8s-node-1:5000"
  CI_REGISTRY_IMAGE: "$CI_PROJECT_PATH_SLUG"

  # ============================================
  # Maven 默认值
  # ============================================
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository -XX:+TieredCompilation -XX:TieredStopAtLevel=1 -Xms512m -Xmx1024m"
  BUILD_SHELL: 'mvn clean package -B -DskipTests -f pom.xml -s settings.xml'
  TEST_SHELL: 'mvn test jacoco:report -B -U -f pom.xml -s settings.xml'

  # ============================================
  # K8s 配置
  # ============================================
  SERVICE_TYPE: "ClusterIP"
  SERVICE_PORT: "8080"
  CONTAINER_PORT: "8080"
  IMAGE_PULL_POLICY: "Always"
  IMAGE_PULL_SECRETS: "docker-secret"
  REPLICAS: "1"
  MAX_SURGE: "1"
  MAX_UNAVAILABLE: "0"

  # 资源
  MEMORY_REQUEST: "256Mi"
  CPU_REQUEST: "200m"
  MEMORY_LIMIT: "512Mi"
  CPU_LIMIT: "1000m"

  # 健康检查
  HEALTH_CHECK_PATH: "/actuator/health"
  LIVENESS_INITIAL_DELAY: "60"
  READINESS_INITIAL_DELAY: "30"

  # Java 堆
  JAVA_MIN_HEAP: "256m"
  JAVA_MAX_HEAP: "512m"

  # HPA
  HPA_MIN_REPLICAS: "1"
  HPA_MAX_REPLICAS: "2"
  HPA_CPU_THRESHOLD: "70"
  HPA_MEMORY_THRESHOLD: "80"
  HPA_SCALE_DOWN_WINDOW: "300"

# =============================================================================
# 共享 changes 路径列表 (YAML anchor 复用,避免 4 处重复)
# =============================================================================
# Hidden job - 不加入 pipeline graph,承载 YAML anchor 数据
# (加 script/tags 是为了让 GitLab CI 严格校验器满意;脚本因隐藏而不执行)
.aggregate_change_paths_anchor:
  stage: test
  tags: [placeholder]
  script: ["true"]
  change_list: &aggregate_change_paths
    - SpringBootStarry/StarryCommon/**/*
    - SpringBootStarry/StarryConfig/**/*
    - SpringBootStarry/StarryStarter/**/*
    - SpringBootStarry/pom.xml
    - pom.xml
    - SpringBootStarry/StarryGateway/**/*
    - SpringBootStarry/StarryDataCenter/**/*
    - SpringBootStarry/StarryAdmin/**/*
    - SpringBootStarry/StarryApi/**/*
    - SpringBootStarry/StarryAuth/**/*
    - SpringBootStarry/StarryOauthServer/**/*
    - SpringBootStarry/StarryOauthResource/**/*

# =============================================================================
# 阶段 1: 全项目编译验证
# =============================================================================
aggregate:compile:
  extends: .aggregate_maven_compile
  image: $MAVEN_IMAGE
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# =============================================================================
# 阶段 2: 单元测试 (线性顺序,避免并行 job 超出集群 quota)
# =============================================================================
aggregate:test:
  extends: .aggregate_test_all
  image: $MAVEN_IMAGE
  variables:
    DEPLOYABLE_APPS: >-
      SpringBootStarry/StarryGateway
      SpringBootStarry/StarryDataCenter
      SpringBootStarry/StarryAdmin
      SpringBootStarry/StarryApi
      SpringBootStarry/StarryAuth
      SpringBootStarry/StarryOauthServer
      SpringBootStarry/StarryOauthResource
  needs: ["aggregate:compile"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# =============================================================================
# 阶段 3: Maven package (线性顺序构建 - 资源不足时避免 OOM)
# =============================================================================
aggregate:package:
  extends: .aggregate_mvn_package_all
  image: $MAVEN_IMAGE
  variables:
    DEPLOYABLE_APPS: >-
      SpringBootStarry/StarryGateway
      SpringBootStarry/StarryDataCenter
      SpringBootStarry/StarryAdmin
      SpringBootStarry/StarryApi
      SpringBootStarry/StarryAuth
      SpringBootStarry/StarryOauthServer
      SpringBootStarry/StarryOauthResource
  needs: ["aggregate:compile"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "test" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_TAG'
      changes: *aggregate_change_paths

# =============================================================================
# 阶段 4: Docker 镜像构建 (线性顺序)
# =============================================================================
aggregate:build:
  extends: .aggregate_docker_build_all
  image: $DOCKER_IMAGE
  variables:
    DEPLOYABLE_APPS: >-
      SpringBootStarry/StarryGateway
      SpringBootStarry/StarryDataCenter
      SpringBootStarry/StarryAdmin
      SpringBootStarry/StarryApi
      SpringBootStarry/StarryAuth
      SpringBootStarry/StarryOauthServer
      SpringBootStarry/StarryOauthResource
  needs: ["aggregate:package", "aggregate:test"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "test" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_TAG'
      changes: *aggregate_change_paths

# =============================================================================
# 阶段 5: Trivy 镜像扫描 (线性顺序)
# =============================================================================
aggregate:scan:
  extends: .aggregate_trivy_scan_all
  image: $DOCKER_IMAGE
  variables:
    DEPLOYABLE_APPS: >-
      SpringBootStarry/StarryGateway
      SpringBootStarry/StarryDataCenter
      SpringBootStarry/StarryAdmin
      SpringBootStarry/StarryApi
      SpringBootStarry/StarryAuth
      SpringBootStarry/StarryOauthServer
      SpringBootStarry/StarryOauthResource
  needs: ["aggregate:build"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "test" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_TAG'
      changes: *aggregate_change_paths

# =============================================================================
# 阶段 6: Kubernetes 部署 (线性顺序)
# =============================================================================
aggregate:deploy:
  extends: .aggregate_k8s_deploy_all
  image:
    name: $KUBECTL_IMAGE
    entrypoint: [ "" ]
  variables:
    DEPLOYABLE_APPS: >-
      SpringBootStarry/StarryGateway
      SpringBootStarry/StarryDataCenter
      SpringBootStarry/StarryAdmin
      SpringBootStarry/StarryApi
      SpringBootStarry/StarryAuth
      SpringBootStarry/StarryOauthServer
      SpringBootStarry/StarryOauthResource
  needs: ["aggregate:build"]
  # 覆盖继承的 rules,加入 changes 过滤(与 build 保持一致,避免 docs-only push 触发 deploy)
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      variables:
        K8S_ENV: "dev"
        K8S_NAMESPACE: "app-dev"
      changes: *aggregate_change_paths
    - if: '$CI_COMMIT_BRANCH == "test"'
      variables:
        K8S_ENV: "test"
        K8S_NAMESPACE: "app-test"
      changes: *aggregate_change_paths
    - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main"'
      variables:
        K8S_ENV: "pre-prod"
        K8S_NAMESPACE: "app-pre-prod"
      changes: *aggregate_change_paths
    - if: '$CI_COMMIT_TAG'
      variables:
        K8S_ENV: "prod"
        K8S_NAMESPACE: "app-prod"
      changes: *aggregate_change_paths
