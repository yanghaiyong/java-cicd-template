# ============================================
# 通用 Java 聚合项目 CI/CD 流水线模板 (Harbor 版本)
# ============================================
# 适用场景: Maven 多模块聚合项目,使用 Harbor 镜像仓库 + containerd
# 与 java-pipeline-aggregate.yaml 的区别:
#   - 使用 Docker-in-Docker (dind) 构建镜像 (containerd 环境兼容)
#   - 镜像仓库: Harbor (harbor-ui.test.com)
#   - 凭据在 GitLab CI/CD Variables 中配置
#
# 使用方式:
#   .gitlab-ci.yml:
#     include:
#       - project: 'cidevops/java-cicd-template'
#         ref: master
#         file: 'templates/java-pipeline-aggregate-harbor.yaml'
#
#     variables:
#       CI_REGISTRY: harbor-ui.test.com
#       CI_REGISTRY_IMAGE: springboot
#       CI_REGISTRY_USER: admin
#       CI_REGISTRY_PASSWORD: <your-harbor-password>
#       KUBECONFIG_CONTENT: <base64 kubeconfig>
# =============================================================================

include:
  - project: 'cidevops/java-cicd-template'
    ref: master
    file: 'jobs/common_aggregate_harbor/package.yaml'
  - project: 'cidevops/java-cicd-template'
    ref: master
    file: 'jobs/common_aggregate_harbor/test.yaml'
  - project: 'cidevops/java-cicd-template'
    ref: master
    file: 'jobs/common_aggregate_harbor/build.yaml'
  - project: 'cidevops/java-cicd-template'
    ref: master
    file: 'jobs/common_aggregate_harbor/scan.yaml'
  - project: 'cidevops/java-cicd-template'
    ref: master
    file: 'jobs/common_aggregate_harbor/deploy.yaml'

stages:
  - package
  - test
  - build
  - scan
  - deploy

variables:
  # ============================================
  # [通用] 与 common-java-pipeline.yaml 同族同名同值
  #   本段只放与镜像仓库无关的变量;同名同值是刻意约定,
  #   需要不同值请放到下方 [Harbor 专有] 段。
  # ============================================
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository -XX:+TieredCompilation -XX:TieredStopAtLevel=1 -Xms512m -Xmx1024m"

  # 统一镜像变量(与 java-pipeline-aggregate.yaml 同名同值, 与镜像仓库无关)
  SKYWALKING_AGENT_IMAGE: "apache/skywalking-java-agent:9.6.0-java17"
  # 有意与 common-java-pipeline.yaml 不同: 用项目自带 settings.xml(公网),common_java 用内网 Nexus3
  BUILD_SHELL: 'mvn clean package -B -DskipTests -f pom.xml -s settings.xml'
  TEST_SHELL: 'mvn test jacoco:report -B -U -f pom.xml -s settings.xml'

  # 构建产物 / 测试报告
  CACHE_DIR: 'target/'
  ARTIFACTS: 'target/'
  ARTIFACTS_NAME: '$CI_JOB_NAME-$CI_COMMIT_REF_NAME'
  JUNIT_REPORT_PATH: 'target/surefire-reports/'
  JACOCO_REPORT_PATH: 'target/site/jacoco/jacoco.xml'
  JACOCO_REPORT_DIR: 'target/site/jacoco/'
  # 聚合项目 _all 变体的模块 glob(项目布局相关,可按项目覆盖)
  AGGREGATE_MODULES_GLOB: 'SpringBootStarry/Starry*'

  # 名称 / K8s 路径
  APP_NAME: "$CI_PROJECT_NAME"
  K8S_BASE_PATH: "src/main/k8s"
  K8S_FILE: "deploy.yaml"

  # ============================================
  # K8s 配置
  # ============================================
  SERVICE_TYPE: "ClusterIP"
  SERVICE_PORT: "8080"
  CONTAINER_PORT: "8080"
  IMAGE_PULL_POLICY: "Always"
  REPLICAS: "1"
  MAX_SURGE: "1"
  MAX_UNAVAILABLE: "0"

  # 资源
  MEMORY_REQUEST: "256Mi"
  CPU_REQUEST: "200m"
  MEMORY_LIMIT: "512Mi"
  CPU_LIMIT: "1000m"

  # 健康检查
  HEALTH_CHECK_PATH: "/actuator/health"
  LIVENESS_INITIAL_DELAY: "60"
  READINESS_INITIAL_DELAY: "30"

  # Java 堆
  JAVA_MIN_HEAP: "256m"
  JAVA_MAX_HEAP: "512m"

  # HPA
  HPA_MIN_REPLICAS: "1"
  HPA_MAX_REPLICAS: "2"
  HPA_CPU_THRESHOLD: "70"
  HPA_MEMORY_THRESHOLD: "80"
  HPA_SCALE_DOWN_WINDOW: "300"

  # ============================================
  # [Harbor 专有] 需特殊值,勿与 common-java-pipeline.yaml 直接对齐
  # ============================================
  MAVEN_IMAGE: "maven:3.9.6-eclipse-temurin-17"
  DOCKER_IMAGE: "docker:24.0.7-dind"
  KUBECTL_IMAGE: "bitnami/kubectl:1.30"
  DOCKERFILE_PATH: "src/main/docker/Dockerfile"
  IMAGE_PULL_SECRETS: "harbor-secret"
  CI_REGISTRY: "harbor-ui.test.com"
  CI_REGISTRY_IMAGE: "$CI_PROJECT_PATH_SLUG"
  # 凭据统一由项目级 CI/CD 变量注入(project/group), 模板不设默认值
  # CI_REGISTRY_USER: ""
  # CI_REGISTRY_PASSWORD: ""

# =============================================================================
# 共享 changes 路径列表 (YAML anchor 复用)
# =============================================================================
.aggregate_change_paths_anchor:
  stage: test
  tags: [placeholder]
  script: ["true"]
  change_list: &aggregate_change_paths
    - SpringBootStarry/StarryCommon/**/*
    - SpringBootStarry/StarryConfig/**/*
    - SpringBootStarry/StarryStarter/**/*
    - SpringBootStarry/pom.xml
    - pom.xml
    - SpringBootStarry/StarryGateway/**/*
    - SpringBootStarry/StarryDataCenter/**/*
    - SpringBootStarry/StarryAdmin/**/*
    - SpringBootStarry/StarryApi/**/*
    - SpringBootStarry/StarryAuth/**/*
    - SpringBootStarry/StarryOauthServer/**/*
    - SpringBootStarry/StarryOauthResource/**/*

# =============================================================================
# 阶段 1: 全项目编译验证
# =============================================================================
aggregate:compile:
  extends: .aggregate_maven_compile
  image: $MAVEN_IMAGE
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# =============================================================================
# 阶段 2: 单元测试 (线性顺序)
# =============================================================================
aggregate:test:
  extends: .aggregate_test_all
  image: $MAVEN_IMAGE
  variables:
    DEPLOYABLE_APPS: >-
      SpringBootStarry/StarryGateway
      SpringBootStarry/StarryDataCenter
      SpringBootStarry/StarryAdmin
      SpringBootStarry/StarryApi
      SpringBootStarry/StarryAuth
      SpringBootStarry/StarryOauthServer
      SpringBootStarry/StarryOauthResource
  needs: ["aggregate:compile"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# =============================================================================
# 阶段 3: Maven package (线性顺序)
# =============================================================================
aggregate:package:
  extends: .aggregate_mvn_package_all
  image: $MAVEN_IMAGE
  variables:
    DEPLOYABLE_APPS: >-
      SpringBootStarry/StarryGateway
      SpringBootStarry/StarryDataCenter
      SpringBootStarry/StarryAdmin
      SpringBootStarry/StarryApi
      SpringBootStarry/StarryAuth
      SpringBootStarry/StarryOauthServer
      SpringBootStarry/StarryOauthResource
  needs: ["aggregate:compile"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "test" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_TAG'
      changes: *aggregate_change_paths

# =============================================================================
# 阶段 4: Docker 镜像构建 (线性顺序)
# =============================================================================
aggregate:build:
  extends: .aggregate_docker_build_all
  image: $DOCKER_IMAGE
  variables:
    DEPLOYABLE_APPS: >-
      SpringBootStarry/StarryGateway
      SpringBootStarry/StarryDataCenter
      SpringBootStarry/StarryAdmin
      SpringBootStarry/StarryApi
      SpringBootStarry/StarryAuth
      SpringBootStarry/StarryOauthServer
      SpringBootStarry/StarryOauthResource
  needs: ["aggregate:package", "aggregate:test"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "test" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_TAG'
      changes: *aggregate_change_paths

# =============================================================================
# 阶段 5: Trivy 镜像扫描 (线性顺序)
# =============================================================================
aggregate:scan:
  extends: .aggregate_trivy_scan_all
  image: $DOCKER_IMAGE
  variables:
    DEPLOYABLE_APPS: >-
      SpringBootStarry/StarryGateway
      SpringBootStarry/StarryDataCenter
      SpringBootStarry/StarryAdmin
      SpringBootStarry/StarryApi
      SpringBootStarry/StarryAuth
      SpringBootStarry/StarryOauthServer
      SpringBootStarry/StarryOauthResource
  needs: ["aggregate:build"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "test" || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_TAG'
      changes: *aggregate_change_paths

# =============================================================================
# 阶段 6: Kubernetes 部署 (线性顺序)
# =============================================================================
aggregate:deploy:
  extends: .aggregate_k8s_deploy_all
  image:
    name: $KUBECTL_IMAGE
    entrypoint: [ "" ]
  variables:
    DEPLOYABLE_APPS: >-
      SpringBootStarry/StarryGateway
      SpringBootStarry/StarryDataCenter
      SpringBootStarry/StarryAdmin
      SpringBootStarry/StarryApi
      SpringBootStarry/StarryAuth
      SpringBootStarry/StarryOauthServer
      SpringBootStarry/StarryOauthResource
  needs: ["aggregate:build"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      variables:
        K8S_ENV: "dev"
        K8S_NAMESPACE: "app-dev"
      changes: *aggregate_change_paths
    - if: '$CI_COMMIT_BRANCH == "test"'
      variables:
        K8S_ENV: "test"
        K8S_NAMESPACE: "app-test"
      changes: *aggregate_change_paths
    - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main"'
      variables:
        K8S_ENV: "pre-prod"
        K8S_NAMESPACE: "app-pre-prod"
      changes: *aggregate_change_paths
    - if: '$CI_COMMIT_TAG'
      variables:
        K8S_ENV: "prod"
        K8S_NAMESPACE: "app-prod"
      changes: *aggregate_change_paths
