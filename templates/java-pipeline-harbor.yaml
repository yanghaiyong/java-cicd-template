# ============================================
# 通用 Java 单体项目 CI/CD 流水线模板 (Harbor 版本)
# ============================================
# 适用场景: 单体 Java 项目,使用 Harbor 镜像仓库
# 与 common-java-pipeline.yaml 的区别:
#   - 镜像仓库: Harbor (harbor-ui.test.com)
#   - 构建: DinD service + classic builder (DOCKER_BUILDKIT=0), 需 docker daemon
#   - 凭据: 项目级 CI_REGISTRY_USER/PASSWORD → job 内 docker login
#   - 其余变量与 common-java-pipeline.yaml 同名同值 (见 README 变量契约)
#
# 使用方式:
#   .gitlab-ci.yml:
#     include:
#       - project: 'cidevops/java-cicd-template'
#         ref: master
#         file: 'templates/java-pipeline-harbor.yaml'
#
#     variables:
#       CI_REGISTRY: harbor-ui.test.com
#       CI_REGISTRY_IMAGE: my-project
#       CI_REGISTRY_USER: admin
#       CI_REGISTRY_PASSWORD: <your-harbor-password>
#       KUBECONFIG_CONTENT: <base64 kubeconfig>
# =============================================================================

include:
  - project: 'cidevops/java-cicd-template'
    ref: master
    file: 'jobs/common_java_harbor/package.yaml'
  - project: 'cidevops/java-cicd-template'
    ref: master
    file: 'jobs/common_java_harbor/test.yaml'
  - project: 'cidevops/java-cicd-template'
    ref: master
    file: 'jobs/common_java_harbor/build.yaml'
  - project: 'cidevops/java-cicd-template'
    ref: master
    file: 'jobs/common_java_harbor/deploy.yaml'
  - project: 'cidevops/java-cicd-template'
    ref: master
    file: 'jobs/common_java_harbor/scan.yaml'

stages:
  - package
  - test
  - build
  - scan
  - deploy

variables:
  # ============================================
  # [通用] 与 common-java-pipeline.yaml 同名同值
  #   本段只放与镜像仓库无关的变量;同名同值是刻意约定,不要在此改成 Harbor 专属值,
  #   需要不同值请放到下方 [Harbor 专有] 段。
  # ============================================
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository -XX:+TieredCompilation -XX:TieredStopAtLevel=1 -Xms512m -Xmx1024m"

  # 统一镜像变量(与 common-java-pipeline.yaml 同名同值, 与镜像仓库无关)
  SKYWALKING_AGENT_IMAGE: "apache/skywalking-java-agent:9.6.0-java17"

  # 通用 CI 变量(与 common-java-pipeline.yaml 同名同值)
  CI_DEBUG_TRACE: "false"
  GIT_CHECKOUT: "true"

  # 与 common-java-pipeline.yaml 同名同值: 统一走 Runner 挂载的内网 Nexus3(/etc/maven/settings.xml)
  BUILD_SHELL: 'mvn clean package -B -DskipTests -f pom.xml -s /etc/maven/settings.xml'
  TEST_SHELL: 'mvn test jacoco:report -B -U -f pom.xml -s /etc/maven/settings.xml'

  # 构建产物 / 测试报告
  CACHE_DIR: 'target/'
  ARTIFACTS: 'target/'
  ARTIFACTS_NAME: '$CI_JOB_NAME-$CI_COMMIT_REF_NAME'
  JUNIT_REPORT_PATH: 'target/surefire-reports/'
  JACOCO_REPORT_PATH: 'target/site/jacoco/jacoco.xml'
  # common_java 无此项;Harbor 保留 jacoco HTML 目录作为 artifacts 才需要
  JACOCO_REPORT_DIR: 'target/site/jacoco/'

  # K8s 路径与名称
  APP_NAME: "$CI_PROJECT_NAME"
  K8S_BASE_PATH: "src/main/k8s"
  K8S_ENV: "dev"
  K8S_FILE: "deploy.yaml"
  K8S_NAMESPACE: 'app-${K8S_ENV}'

  # ============================================
  # K8s 配置
  # ============================================
  SERVICE_TYPE: "ClusterIP"
  SERVICE_PORT: "8080"
  CONTAINER_PORT: "8080"
  IMAGE_PULL_POLICY: "Always"
  REPLICAS: "1"
  MAX_SURGE: "1"
  MAX_UNAVAILABLE: "0"

  # 资源
  MEMORY_REQUEST: "256Mi"
  CPU_REQUEST: "200m"
  MEMORY_LIMIT: "512Mi"
  CPU_LIMIT: "1000m"

  # 健康检查
  HEALTH_CHECK_PATH: "/actuator/health"
  LIVENESS_INITIAL_DELAY: "60"
  READINESS_INITIAL_DELAY: "30"

  # Java 堆
  JAVA_MIN_HEAP: "256m"
  JAVA_MAX_HEAP: "512m"

  # ============================================
  # HPA
  # ============================================
  HPA_MIN_REPLICAS: "1"
  HPA_MAX_REPLICAS: "2"
  HPA_CPU_THRESHOLD: "70"
  HPA_MEMORY_THRESHOLD: "80"
  HPA_SCALE_DOWN_WINDOW: "300"

  # ============================================
  # [Harbor 专有] 需特殊值,勿与 common-java-pipeline.yaml 直接对齐
  # ============================================
  MAVEN_IMAGE: "maven:3.9.6-eclipse-temurin-17"
  DOCKER_IMAGE: "docker:24"
  KUBECTL_IMAGE: "docker.io/bitnamilegacy/kubectl:1.30.3"
  TRIVY_IMAGE: "$CI_REGISTRY/library/trivy:latest"
  DOCKERFILE_PATH: "src/main/docker/Dockerfile"
  IMAGE_PULL_SECRETS: "harbor-secret"
  CI_REGISTRY: "harbor-ui.test.com"
  CI_REGISTRY_IMAGE: "$CI_PROJECT_PATH_SLUG"
  CI_REGISTRY_FULL_IMAGE: "$CI_REGISTRY/$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  # 凭据统一由项目级 CI/CD 变量注入(project/group), 模板不设默认值
  # CI_REGISTRY_USER: ""
  # CI_REGISTRY_PASSWORD: ""

# =============================================================================
# 顶层缓存(与 common-java-pipeline.yaml 一致)
# =============================================================================
cache:
  paths:
    - .m2/repository
    - ${CACHE_DIR}

# =============================================================================
# 阶段 1: Maven 构建
# =============================================================================
package:
  stage: package
  extends: .mvn_package
  image: $MAVEN_IMAGE

# =============================================================================
# 阶段 2: 单元测试
# =============================================================================
test:
  stage: test
  extends: .test
  image: $MAVEN_IMAGE
  needs: ["package"]

# =============================================================================
# 阶段 3: Docker 镜像构建
# =============================================================================
build:
  stage: build
  extends: .docker_build
  image: $DOCKER_IMAGE
  needs: ["package"]

# =============================================================================
# 阶段 5: Kubernetes 部署
# =============================================================================
deploy:
  stage: deploy
  extends: .k8s_deploy
  image:
    name: $KUBECTL_IMAGE
    entrypoint: [ "" ]
  needs: ["build"]
